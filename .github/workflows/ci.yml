name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - name: Build (public config from .env.production)
        run: npm run build
      - name: Check the bundle for debug tokens and canaries
        run: node scripts/check-bundle.mjs
      - name: Install Playwright Chromium (CI only)
        run: npm install -g playwright@1.63.0 && npx -y playwright@1.63.0 install --with-deps chromium
      - name: End-to-end checks
        run: cd apps/web && node --experimental-strip-types e2e/flows.mjs && node e2e/motion-check.mjs
      - name: Rules baseline is reproducible
        run: node scripts/run-ts.mjs packages/benchmark/src/run-baseline.ts
