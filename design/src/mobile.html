<title>Mosaic Mobile Design</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>/*@CSS*/</style>
<div id="app-root" data-appearance="light" data-accent="indigo">
  <div class="stage">
    <aside class="pv pv-panel" id="pv" aria-label="Design preview controls"></aside>
    <div class="device-col">
      <div class="device-scaler" id="scaler">
        <div class="device" id="device">
          <div class="statusbar" aria-hidden="true">
            <span class="sb-time">10:42</span>
            <span class="sb-island"></span>
            <span class="sb-icons" id="sb-icons"></span>
          </div>
          <div class="stack" id="stack"></div>
          <nav class="tabbar glass" id="tabbar" data-refract aria-label="Main"></nav>
          <div class="sheet-layer" id="sheets"></div>
          <div id="toast-host"></div>
        </div>
      </div>
      <p class="device-caption">Design preview · iOS-style mobile layout · sample data, no model calls</p>
    </div>
    <aside class="notes" id="notes" aria-label="Screen notes"></aside>
  </div>
  <button type="button" class="pv-fab" id="pv-fab" aria-controls="pv" aria-expanded="false">Preview controls</button>
</div>
<script>/*@JS*/</script>
