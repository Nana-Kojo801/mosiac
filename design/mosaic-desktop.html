/* ===== base ===== */
*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-ui); -webkit-font-smoothing: antialiased; }
#app-root { background: var(--bg); color: var(--ink); font-family: var(--font-ui); font-size: var(--fs-subhead); line-height: 1.4; min-height: 100%; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2.5px solid var(--focus); outline-offset: 2px; border-radius: 8px; }
.ic { flex: none; display: inline-block; vertical-align: middle; }
.mono, code, kbd { font-family: var(--font-mono); font-size: 0.86em; }
.tnum { font-variant-numeric: tabular-nums; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
h1, h2, h3, h4 { margin: 0; text-wrap: balance; letter-spacing: -0.01em; }
p { margin: 0; }

.logo .lg-a { fill: var(--accent); }
.logo .lg-b { fill: var(--ink); opacity: 0.82; }
.logo .lg-c { fill: var(--ink); opacity: 0.34; }

/* ===== Liquid Glass (12.4) ===== */
.glass {
  position: relative;
  background: var(--glass-tint);
  -webkit-backdrop-filter: blur(var(--glass-blur)) saturate(var(--glass-sat));
  backdrop-filter: blur(var(--glass-blur)) saturate(var(--glass-sat));
  box-shadow: var(--glass-shadow), inset 0 1px 0 0 var(--glass-rim), 0 0 0 0.5px var(--glass-rim-outer);
  isolation: isolate;
}
.glass::before {
  /* specular edge highlight: brighter top-left and bottom-right rims */
  content: ""; position: absolute; inset: 0; border-radius: inherit; padding: 1px; pointer-events: none; z-index: 1;
  background: linear-gradient(135deg, var(--glass-spec-a) 0%, transparent 32%, transparent 68%, var(--glass-spec-b) 100%);
  -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
  -webkit-mask-composite: xor; mask-composite: exclude;
}
.glass-strong { background: var(--glass-tint-strong); }
.glass.refracting { background: var(--glass-tint-strong); }
.glass-flat { box-shadow: inset 0 -0.5px 0 var(--hairline-strong); }
.glass-flat::before { display: none; }

@supports not ((backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px))) {
  .glass { background: var(--glass-opaque); }
}
[data-transparency="reduced"] .glass,
[data-transparency="reduced"] .glass-strong { background: var(--glass-opaque) !important; -webkit-backdrop-filter: none !important; backdrop-filter: none !important; }
[data-transparency="reduced"] .glass::before { display: none; }
@media (prefers-reduced-transparency: reduce) {
  .glass, .glass-strong { background: var(--glass-opaque) !important; -webkit-backdrop-filter: none !important; backdrop-filter: none !important; }
  .glass::before { display: none; }
}
@media (prefers-contrast: more) {
  .glass, .glass-strong { background: var(--glass-opaque) !important; -webkit-backdrop-filter: none !important; backdrop-filter: none !important; box-shadow: 0 0 0 1.5px var(--ink) !important; }
  .glass::before { display: none; }
  .chip, .src, .status { box-shadow: inset 0 0 0 1px currentColor; }
}

/* ===== buttons ===== */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 44px; padding: 0 18px; border-radius: 999px; font-weight: 600; font-size: var(--fs-subhead); white-space: nowrap; transition: transform var(--dur-1) var(--ease-out), background var(--dur-1); }
.btn:active { transform: scale(0.97); }
.btn-primary { background: var(--accent); color: var(--accent-ink); }
.btn-tinted { background: var(--accent-soft); color: var(--accent-text); }
.btn-plain { color: var(--accent-text); padding: 0 10px; }
.btn-quiet { background: var(--surface-sunk); color: var(--ink); }
.btn-danger { background: var(--risk-crit-bg); color: var(--risk-crit-fg); }
.btn-sm { min-height: 34px; padding: 0 14px; font-size: var(--fs-footnote); }
.btn[disabled], .btn[aria-disabled="true"] { opacity: 0.42; pointer-events: none; }
.icon-btn { display: inline-grid; place-items: center; width: 44px; height: 44px; border-radius: 999px; color: var(--ink); }
.icon-btn.glass { width: 40px; height: 40px; }

/* ===== chips: risk always pairs icon + text + color ===== */
.chip, .src, .status, .pack-src { display: inline-flex; align-items: center; gap: 5px; border-radius: 999px; font-weight: 600; white-space: nowrap; line-height: 1; }
.chip { padding: 5px 9px 5px 7px; font-size: var(--fs-caption); }
.chip-sm { padding: 3px 7px 3px 5px; }
.chip-low { color: var(--risk-low-fg); background: var(--risk-low-bg); }
.chip-mod { color: var(--risk-mod-fg); background: var(--risk-mod-bg); }
.chip-high { color: var(--risk-high-fg); background: var(--risk-high-bg); }
.chip-crit { color: var(--risk-crit-fg); background: var(--risk-crit-bg); }
.chip-unassessed { color: var(--unassessed-fg); background: var(--unassessed-bg); }
.chip-ok { color: var(--ok-fg); background: var(--ok-bg); }
.src { padding: 4px 8px 4px 6px; font-size: var(--fs-micro); letter-spacing: 0.01em; }
.src-device { color: var(--src-device-fg); background: var(--src-device-bg); }
.src-cloud { color: var(--src-cloud-fg); background: var(--src-cloud-bg); }
.src-rules, .src-unknown { color: var(--src-rules-fg); background: var(--src-rules-bg); }
.src-unavail { color: var(--unassessed-fg); background: var(--unassessed-bg); }
.src-fixture { color: var(--ink-2); background: transparent; box-shadow: inset 0 0 0 1px var(--hairline-strong); }
.status { font-size: var(--fs-caption); color: var(--ink-2); font-weight: 500; }
.status-resolved { color: var(--ok-fg); }
.status-unassessed { color: var(--unassessed-fg); }
.status-under_review { color: var(--accent-text); }
.pack-src { padding: 3px 7px 3px 6px; font-size: var(--fs-micro); color: var(--ink-2); background: var(--surface-sunk); }
.pack-cloud { color: var(--src-cloud-fg); background: var(--src-cloud-bg); }
.policy { font-size: var(--fs-micro); padding: 2px 6px; border-radius: 6px; background: var(--surface-sunk); color: var(--ink-2); letter-spacing: 0; }
.preview-flag { display: inline-flex; align-items: center; gap: 6px; font-size: var(--fs-micro); font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--ink-3); }

/* ===== evidence marks ===== */
mark.ev { background: var(--mark-bg); color: inherit; border-radius: 4px; padding: 1px 2px; box-shadow: inset 0 -2px 0 var(--mark-line); cursor: pointer; transition: background var(--dur-1); }
mark.ev:hover, mark.ev.active { background: var(--mark-active-bg); }
mark.ev-high, mark.ev-crit { --mark-line: var(--risk-high-fg); }
mark.ev-low { --mark-line: var(--ink-3); background: var(--surface-sunk); }
mark.ev.flash { animation: flash 1.1s var(--ease-out); }
@keyframes flash { 0%, 40% { box-shadow: inset 0 -2px 0 var(--mark-line), 0 0 0 4px var(--mark-active-bg); } 100% { box-shadow: inset 0 -2px 0 var(--mark-line), 0 0 0 0 transparent; } }
.para { position: relative; }
.para-anchor { font-family: var(--font-mono); font-size: var(--fs-micro); color: var(--ink-3); user-select: none; }
del.diff, ins.diff { text-decoration: none; border-radius: 4px; padding: 1px 3px; }
del.diff { background: var(--diff-del-bg); color: var(--diff-del-fg); text-decoration: line-through; text-decoration-thickness: 1px; }
ins.diff { background: var(--diff-add-bg); color: var(--diff-add-fg); }

/* ===== score ===== */
.score { display: grid; gap: 8px; }
.score-row { display: grid; grid-template-columns: 1fr auto 32px; align-items: center; gap: 10px; font-size: var(--fs-footnote); color: var(--ink-2); }
.score-pips { display: inline-flex; gap: 3px; }
.score-pips i { width: 16px; height: 6px; border-radius: 3px; background: var(--surface-sunk); box-shadow: inset 0 0 0 0.5px var(--hairline-strong); }
.score-pips i.on { background: var(--ink-2); box-shadow: none; }
.score-num { font-family: var(--font-mono); font-size: var(--fs-micro); text-align: right; color: var(--ink-3); }
.score-total { display: flex; justify-content: space-between; align-items: baseline; padding-top: 8px; border-top: 0.5px solid var(--hairline-strong); font-size: var(--fs-footnote); color: var(--ink-2); }
.score-total strong { font-size: var(--fs-title-3); color: var(--ink); font-variant-numeric: tabular-nums; }
.score-total small { font-size: var(--fs-footnote); color: var(--ink-3); font-weight: 500; }

/* ===== mosaic (fictional group-size illustration) ===== */
.mosaic { display: grid; grid-template-columns: repeat(10, 1fr); gap: 3px; aspect-ratio: 1; max-width: 100%; }
.mosaic .tile { border-radius: 3px; background: var(--accent); transition: opacity var(--dur-3) var(--ease-out), transform var(--dur-3) var(--spring), background var(--dur-3); }
.mosaic .tile.out { background: var(--ink-3); opacity: 0.16; transform: scale(0.72); }
.mosaic .tile.out-1 { opacity: 0.22; }
.mosaic .tile.out-2 { opacity: 0.16; }
.mosaic .tile.out-3 { opacity: 0.11; }
.illustrative { display: inline-flex; align-items: center; gap: 5px; font-size: var(--fs-micro); color: var(--ink-3); font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; }

/* ===== switches & segmented ===== */
.switch { position: relative; width: 51px; height: 31px; flex: none; }
.switch input { position: absolute; inset: 0; opacity: 0; margin: 0; cursor: pointer; z-index: 1; }
.switch span { position: absolute; inset: 0; border-radius: 999px; background: var(--surface-sunk); box-shadow: inset 0 0 0 0.5px var(--hairline-strong); transition: background var(--dur-2); }
.switch span::after { content: ""; position: absolute; top: 2px; left: 2px; width: 27px; height: 27px; border-radius: 50%; background: #fff; box-shadow: 0 2px 6px rgba(0,0,0,.18), 0 0 0 0.5px rgba(0,0,0,.06); transition: transform var(--dur-2) var(--spring); }
.switch input:checked + span { background: var(--ok-fg); }
.switch input:checked + span::after { transform: translateX(20px); }
.switch input:focus-visible + span { outline: 2.5px solid var(--focus); outline-offset: 2px; }
.seg { display: inline-flex; padding: 2px; border-radius: 10px; background: var(--surface-sunk); gap: 2px; }
.seg button { min-height: 30px; padding: 0 12px; border-radius: 8px; font-size: var(--fs-footnote); font-weight: 600; color: var(--ink-2); }
.seg button[aria-pressed="true"], .seg button[aria-selected="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 3px rgba(0,0,0,.12), 0 0 0 0.5px var(--hairline); }

/* ===== code / payload ===== */
.payload { font-family: var(--font-mono); font-size: 12.5px; line-height: 1.55; background: var(--surface-sunk); border-radius: 12px; padding: 12px 14px; overflow-x: auto; white-space: pre; color: var(--ink); box-shadow: inset 0 0 0 0.5px var(--hairline-strong); }
.payload .k { color: var(--accent-text); }
.payload .s { color: var(--src-device-fg); }

/* ===== banners ===== */
.banner { display: flex; gap: 10px; align-items: flex-start; padding: 12px 14px; border-radius: 14px; font-size: var(--fs-footnote); line-height: 1.45; }
.banner .ic { margin-top: 1px; }
.banner strong { display: block; font-size: var(--fs-subhead); margin-bottom: 2px; }
.banner-warn { background: var(--risk-mod-bg); color: var(--risk-mod-fg); }
.banner-info { background: var(--accent-soft); color: var(--accent-text); }
.banner-neutral { background: var(--surface-sunk); color: var(--ink-2); }
.banner-bad { background: var(--risk-crit-bg); color: var(--risk-crit-fg); }
.banner-un { background: var(--unassessed-bg); color: var(--unassessed-fg); }
.banner .banner-body { flex: 1; min-width: 0; }
.banner .btn { margin-top: 8px; }

/* ===== toast ===== */
#toast-host { position: fixed; left: 50%; bottom: max(24px, env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); display: grid; gap: 8px; z-index: 200; pointer-events: none; }
.toast { display: flex; align-items: center; gap: 8px; padding: 10px 16px; border-radius: 999px; font-size: var(--fs-footnote); font-weight: 600; animation: toast-in var(--dur-2) var(--spring); }
.toast.out { opacity: 0; transform: translateY(8px); transition: all var(--dur-2); }
@keyframes toast-in { from { opacity: 0; transform: translateY(12px) scale(0.96); } }

/* ===== preview control panel (design-tool chrome, deliberately plain) ===== */
.pv { font-family: var(--font-ui); font-size: 13px; color: var(--ink); display: grid; gap: 6px; align-content: start; }
.pv-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.pv-tag { font-family: var(--font-mono); font-size: 11px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; padding: 4px 8px; border: 1.5px dashed var(--ink-3); border-radius: 6px; color: var(--ink-2); }
.pv-ver { font-family: var(--font-mono); font-size: 11px; color: var(--ink-3); }
.pv-note { color: var(--ink-2); font-size: 12px; line-height: 1.45; margin-bottom: 6px; }
.pv-hint { color: var(--ink-3); font-size: 11.5px; line-height: 1.4; }
.pv-label { font-size: 11px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: var(--ink-3); margin-top: 8px; }
.pv-select { width: 100%; min-height: 36px; border-radius: 8px; border: 1px solid var(--hairline-strong); background: var(--surface); padding: 0 10px; font-size: 13px; }
.pv-seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; padding: 2px; border-radius: 8px; background: var(--surface-sunk); }
.pv-seg button { min-height: 30px; border-radius: 6px; font-size: 12.5px; font-weight: 600; color: var(--ink-2); }
.pv-seg button[aria-checked="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,.12); }
.pv-switch { display: flex; align-items: center; gap: 8px; min-height: 32px; font-size: 13px; cursor: pointer; }
.pv-switch input { width: 16px; height: 16px; accent-color: var(--accent); }
.pv-reset { display: inline-flex; align-items: center; gap: 6px; margin-top: 8px; min-height: 34px; padding: 0 12px; border-radius: 8px; border: 1px solid var(--hairline-strong); font-size: 12.5px; font-weight: 600; justify-self: start; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: 1ms !important; transition-duration: 1ms !important; }
}

/* ===== preview bar (design-tool chrome) ===== */
#app-root { display: flex; flex-direction: column; height: 100vh; height: 100dvh; overflow: hidden; }
.pvbar { flex: none; background: var(--surface); border-bottom: 1px solid var(--hairline-strong); padding-block: 8px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); position: relative; z-index: 5; }
.pv-inline { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 12px; }
.pv-inline .pv-head { gap: 8px; }
.pv-inline .pv-note, .pv-inline .pv-hint { display: none; }
.pv-inline .pv-label { margin: 0; }
.pv-inline .pv-select { width: auto; min-height: 30px; max-width: 200px; }
.pv-inline .pv-seg { min-width: 120px; }
.pv-inline .pv-seg button { min-height: 26px; padding: 0 8px; }
.pv-inline .pv-switch { min-height: 28px; }
.pv-inline .pv-reset { margin: 0; min-height: 30px; }
.viewport { flex: 1; position: relative; overflow: hidden; background: var(--bg-deep); }
.win { position: absolute; left: 0; top: 0; transform-origin: 0 0; background: var(--bg); overflow: hidden; }
.backdrop { position: absolute; inset: 0; width: 100%; height: 100%; }
.backdrop .t1 { fill: var(--tile-a); } .backdrop .t2 { fill: var(--tile-b); } .backdrop .t3 { fill: var(--tile-c); }
.app { position: absolute; inset: 0; }

/* ===== shell ===== */
.shell { position: absolute; inset: 0; display: grid; grid-template-columns: 264px minmax(0, 1fr) 352px; gap: 12px; padding: 12px; }
.shell.no-inspector { grid-template-columns: 264px minmax(0, 1fr); }
.sidebar { border-radius: 22px; display: flex; flex-direction: column; padding: 14px 10px 10px; min-height: 0; }
.sidebar > * { position: relative; z-index: 2; }
.sb-brand { display: flex; align-items: center; gap: 9px; padding: 4px 8px 12px; font-weight: 700; font-size: 16px; letter-spacing: -0.01em; }
.sb-brand .preview-flag { margin-left: auto; font-size: 9.5px; }
.ws-switch { display: flex; align-items: center; gap: 10px; width: 100%; padding: 9px 10px; border-radius: 14px; background: color-mix(in srgb, var(--surface) 70%, transparent); box-shadow: inset 0 0 0 0.5px var(--hairline); text-align: left; }
[data-transparency="reduced"] .ws-switch { background: var(--surface); }
.ws-switch .ws-t { font-weight: 600; font-size: 14px; display: block; }
.ws-switch .ws-s { font-size: 11.5px; color: var(--ink-3); display: block; }
.ws-switch .ic:last-child { margin-left: auto; color: var(--ink-3); }
.nav { flex: 1; overflow-y: auto; margin-top: 12px; display: grid; align-content: start; gap: 1px; scrollbar-width: none; }
.nav-h { font-size: 11px; font-weight: 600; color: var(--ink-3); letter-spacing: 0.05em; text-transform: uppercase; padding: 12px 10px 5px; }
.nav-i { display: flex; align-items: center; gap: 10px; min-height: 34px; padding: 0 10px; border-radius: 10px; font-size: 13.5px; font-weight: 500; color: var(--ink); text-align: left; width: 100%; }
.nav-i .ic { color: var(--ink-2); }
.nav-i:hover { background: color-mix(in srgb, var(--ink) 5%, transparent); }
.nav-i[aria-current="page"] { background: var(--accent); color: var(--accent-ink); }
.nav-i[aria-current="page"] .ic { color: var(--accent-ink); }
.nav-i .n { margin-left: auto; font-size: 11.5px; font-weight: 600; color: var(--ink-3); font-variant-numeric: tabular-nums; }
.nav-i[aria-current="page"] .n { color: var(--accent-ink); opacity: 0.85; }
.nav-i .n.hot { color: var(--risk-high-fg); }
.sb-foot { display: grid; gap: 6px; padding-top: 8px; border-top: 0.5px solid var(--hairline-strong); margin-top: 8px; }
.dev-chip { display: flex; align-items: center; gap: 9px; padding: 8px 10px; border-radius: 12px; font-size: 12px; text-align: left; width: 100%; }
.dev-chip:hover { background: color-mix(in srgb, var(--ink) 5%, transparent); }
.dev-chip .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--ink-3); flex: none; }
.dev-chip .dot.ok { background: var(--ok-fg); box-shadow: 0 0 0 3px var(--ok-bg); }
.dev-chip .dot.warn { background: var(--risk-mod-fg); box-shadow: 0 0 0 3px var(--risk-mod-bg); }
.dev-chip .dot.bad { background: var(--risk-crit-fg); box-shadow: 0 0 0 3px var(--risk-crit-bg); }
.dev-chip b { display: block; font-size: 12.5px; font-weight: 600; }
.dev-chip span { color: var(--ink-3); }

.main { position: relative; min-width: 0; min-height: 0; border-radius: 22px; overflow: hidden; background: var(--surface); box-shadow: 0 0 0 0.5px var(--hairline-strong), 0 10px 30px -18px rgba(20, 30, 60, 0.25); }
.main-scroll { position: absolute; inset: 0; overflow-y: auto; padding: 84px 36px 48px; scrollbar-width: thin; }
.main-inner { max-width: 880px; margin: 0 auto; }
.main-inner.wide { max-width: 1100px; }
.topbar-d { position: absolute; z-index: 10; top: 10px; left: 10px; right: 10px; height: 56px; border-radius: 18px; display: flex; align-items: center; gap: 10px; padding: 0 10px 0 16px; }
.topbar-d > * { position: relative; z-index: 2; }
.crumbs { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--ink-3); min-width: 0; }
.crumbs b { color: var(--ink); font-size: 15px; font-weight: 650; white-space: nowrap; }
.topbar-d .spacer { flex: 1; }
.pill-status { display: inline-flex; align-items: center; gap: 7px; height: 32px; padding: 0 12px; border-radius: 16px; font-size: 12.5px; font-weight: 600; background: color-mix(in srgb, var(--surface) 75%, transparent); box-shadow: inset 0 0 0 0.5px var(--hairline); }
[data-transparency="reduced"] .pill-status { background: var(--surface-2); }
.pill-status .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--ink-3); }
.pill-status .dot.ok { background: var(--ok-fg); } .pill-status .dot.warn { background: var(--risk-mod-fg); } .pill-status .dot.bad { background: var(--risk-crit-fg); }
.tb-btn { min-height: 36px; padding: 0 14px; font-size: 13px; }
.kbd { display: inline-grid; place-items: center; min-width: 20px; height: 20px; padding: 0 5px; border-radius: 5px; font-family: var(--font-mono); font-size: 11px; color: var(--ink-2); background: var(--surface-2); box-shadow: inset 0 -1px 0 var(--hairline-strong), inset 0 0 0 0.5px var(--hairline-strong); }

.inspector { border-radius: 22px; display: flex; flex-direction: column; min-height: 0; overflow: hidden; }
.inspector > * { position: relative; z-index: 2; }
.insp-head { padding: 16px 18px 10px; display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.insp-head h2 { font-size: 13px; font-weight: 600; color: var(--ink-3); text-transform: uppercase; letter-spacing: 0.05em; }
.insp-body { flex: 1; overflow-y: auto; padding: 0 14px 18px; scrollbar-width: thin; }
.insp-card { background: var(--surface); border-radius: 16px; padding: 14px; box-shadow: 0 0 0 0.5px var(--hairline); }
.insp-card + .insp-card { margin-top: 10px; }
.insp-label { font-size: 11px; font-weight: 600; color: var(--ink-3); text-transform: uppercase; letter-spacing: 0.05em; margin: 16px 4px 8px; }
.insp-title { font-size: 19px; font-weight: 700; line-height: 1.25; letter-spacing: -0.01em; }
.insp-actions { display: grid; gap: 8px; margin-top: 14px; }
.insp-actions .btn { width: 100%; }
.insp-actions .two { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }

/* ===== content primitives ===== */
.page-h { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; margin-bottom: 20px; }
.page-h h1 { font-size: 30px; font-weight: 750; letter-spacing: -0.02em; line-height: 1.1; }
.page-h p { color: var(--ink-2); margin-top: 6px; font-size: 14.5px; max-width: 60ch; }
.h2 { font-size: 17px; font-weight: 700; margin: 28px 0 10px; display: flex; align-items: baseline; justify-content: space-between; }
.h2 .btn-plain { font-size: 13px; min-height: 28px; font-weight: 600; }
.panel { background: var(--surface-2); border-radius: 16px; padding: 16px; }
.panel.line { background: var(--surface); box-shadow: inset 0 0 0 1px var(--hairline-strong); }
.grid-2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.grid-3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
.hstack { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.muted { color: var(--ink-3); }
.small { font-size: 12.5px; }
.tbl { width: 100%; border-collapse: collapse; font-size: 13.5px; }
.tbl th { text-align: left; font-size: 11.5px; font-weight: 600; color: var(--ink-3); text-transform: uppercase; letter-spacing: 0.04em; padding: 8px 10px; border-bottom: 1px solid var(--hairline-strong); white-space: nowrap; }
.tbl td { padding: 11px 10px; border-bottom: 0.5px solid var(--hairline-strong); vertical-align: middle; }
.tbl tr.sel td { background: var(--accent-soft); }
.tbl tr.clickable { cursor: pointer; }
.tbl tr.clickable:hover td { background: var(--surface-2); }
.tbl tr.sel:hover td { background: var(--accent-soft); }
.tbl tr.done td { color: var(--ink-3); }
.tbl .t-title { font-weight: 600; }
.tbl .mono { color: var(--ink-3); }
.tbl td.num { text-align: right; font-variant-numeric: tabular-nums; }
.filters-d { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 12px; }
.fchip { display: inline-flex; align-items: center; gap: 6px; height: 30px; padding: 0 11px; border-radius: 15px; background: var(--surface); color: var(--ink-2); font-size: 12.5px; font-weight: 600; box-shadow: inset 0 0 0 1px var(--hairline-strong); }
.fchip[aria-pressed="true"] { background: var(--ink); color: var(--bg); box-shadow: none; }
.fchip .n { opacity: 0.65; font-variant-numeric: tabular-nums; }

/* overview */
.status-d { display: grid; grid-template-columns: 1.3fr 1fr; gap: 12px; }
.counts-d { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-top: 14px; }
.count-d { background: var(--surface); border-radius: 12px; padding: 12px; box-shadow: inset 0 0 0 0.5px var(--hairline); text-align: left; }
.count-d strong { display: block; font-size: 28px; line-height: 1; font-variant-numeric: tabular-nums; font-weight: 700; }
.count-d span { display: inline-flex; gap: 4px; align-items: center; font-size: 12px; color: var(--ink-2); margin-top: 6px; }
.count-d.high strong { color: var(--risk-high-fg); } .count-d.mod strong { color: var(--risk-mod-fg); } .count-d.un strong { color: var(--unassessed-fg); }
.coverage-d { display: grid; gap: 10px; font-size: 12.5px; color: var(--ink-2); }
.cov-row { display: grid; grid-template-columns: 70px 1fr auto; gap: 10px; align-items: center; }
.bar { height: 6px; border-radius: 3px; background: var(--surface-sunk); overflow: hidden; display: flex; }
.bar i { display: block; height: 100%; background: var(--src-device-fg); }
.bar i.rules { background: var(--ink-3); }
.bar i.un { background: repeating-linear-gradient(45deg, var(--unassessed-fg) 0 3px, transparent 3px 6px); opacity: 0.6; }
.tool-tile { display: grid; gap: 6px; padding: 14px; border-radius: 14px; background: var(--surface); box-shadow: inset 0 0 0 1px var(--hairline-strong); text-align: left; transition: box-shadow var(--dur-1), transform var(--dur-1); }
.tool-tile:hover { box-shadow: inset 0 0 0 1.5px var(--accent); }
.tool-tile .ic { color: var(--accent-text); }
.tool-tile b { font-size: 14px; }
.tool-tile span { font-size: 12.5px; color: var(--ink-3); }
.doc-ic { width: 30px; height: 36px; border-radius: 6px; display: inline-grid; place-items: center; background: var(--surface-2); color: var(--ink-3); box-shadow: inset 0 0 0 0.5px var(--hairline-strong); vertical-align: middle; }
.doc-ic.draft { background: var(--accent-soft); color: var(--accent-text); box-shadow: none; }

/* reader */
.doc-tabs { display: flex; gap: 4px; margin-bottom: 18px; border-bottom: 1px solid var(--hairline-strong); }
.doc-tab { padding: 10px 12px; font-size: 13.5px; font-weight: 600; color: var(--ink-3); border-bottom: 2px solid transparent; margin-bottom: -1px; display: inline-flex; gap: 6px; align-items: center; }
.doc-tab[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); }
.reader-d { font-size: 16.5px; line-height: 1.7; max-width: 68ch; }
.reader-d .para { display: grid; grid-template-columns: 34px 1fr; gap: 8px; padding: 4px 0 14px; border-radius: 8px; }
.reader-d .para-anchor { padding-top: 6px; text-align: right; padding-right: 6px; }
.reader-d .para.flash { animation: paraflash 1.2s var(--ease-out); }
@keyframes paraflash { 0%, 50% { background: var(--accent-soft); } 100% { background: transparent; } }
.doc-meta { display: flex; gap: 10px; align-items: center; font-size: 12.5px; color: var(--ink-3); margin-bottom: 14px; flex-wrap: wrap; }

/* evidence cards in inspector */
.ev-card { display: grid; gap: 6px; padding: 11px 12px; border-radius: 12px; background: var(--surface-2); text-align: left; width: 100%; }
.ev-card:hover { box-shadow: inset 0 0 0 1px var(--accent); }
.ev-card .ev-src { display: flex; gap: 6px; align-items: center; font-size: 11.5px; color: var(--ink-3); font-weight: 600; }
.ev-card .ev-q { font-size: 13.5px; line-height: 1.5; }
.ev-list { display: grid; gap: 8px; }
.diffbox { font-size: 13.5px; line-height: 1.6; background: var(--surface-2); border-radius: 12px; padding: 10px 12px; }
.note-field { width: 100%; min-height: 70px; border-radius: 10px; border: 0; background: var(--surface-2); box-shadow: inset 0 0 0 1px var(--hairline-strong); padding: 9px 11px; font-size: 13.5px; resize: vertical; }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 7px 12px; font-size: 12.5px; margin: 0; }
.kv dt { color: var(--ink-3); }
.kv dd { margin: 0; text-align: right; font-weight: 500; min-width: 0; overflow-wrap: anywhere; }

/* map */
.graph-wrap { background: var(--surface-2); border-radius: 18px; padding: 14px; overflow-x: auto; }
.graph-wrap svg { display: block; width: 100%; min-width: 640px; height: auto; }
.g-node rect { fill: var(--surface); stroke: var(--hairline-strong); stroke-width: 1; }
.g-node.draft rect { fill: var(--accent-soft); stroke: none; }
.g-node.cat rect { fill: var(--surface); stroke-dasharray: 0; }
.g-node.finding rect { fill: var(--risk-high-bg); stroke: var(--risk-high-fg); stroke-width: 1.2; }
.g-node.finding.mod rect { fill: var(--risk-mod-bg); stroke: var(--risk-mod-fg); }
.g-node.finding.resolved rect { fill: var(--ok-bg); stroke: var(--ok-fg); }
.g-node.sel rect { stroke: var(--focus); stroke-width: 2.5; }
.g-node text { fill: var(--ink); font-family: var(--font-ui); font-size: 13px; font-weight: 600; }
.g-node .sub { fill: var(--ink-3); font-size: 11px; font-weight: 500; }
.g-node .kind { fill: var(--ink-3); font-size: 9.5px; font-weight: 700; letter-spacing: 0.06em; }
.g-node.draft text { fill: var(--accent-text); }
.g-node.finding text { fill: var(--risk-high-fg); }
.g-node.finding.mod text { fill: var(--risk-mod-fg); }

/* ---------- seeded fictional population (8.3) ---------- */
// 100 toy records. IDs are not names. Counts are computed from these sets.
const POPULATION = (() => {
  let seed = 20261119;
  const rnd = () => { seed |= 0; seed = (seed + 0x6d2b79f5) | 0; let t = Math.imul(seed ^ (seed >>> 15), 1 | seed); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
  const ids = Array.from({ length: 100 }, (_, i) => i);
  for (let i = ids.length - 1; i > 0; i--) { const j = Math.floor(rnd() * (i + 1)); [ids[i], ids[j]] = [ids[j], ids[i]]; }
  const A = ids.slice(0, 24); // overnight pharmacy team
  const outside = ids.slice(24);
  const AB = A.slice(0, 8);
  const B = [...AB, ...outside.slice(0, 7)]; // winter onboarding cohort
  const C = [AB[0], outside[10], outside[20]]; // transfer from coastal satellite clinic
  const Cg = [...AB.slice(0, 7), ...A.slice(8, 22), ...outside.slice(30, 69)]; // moved from another site in the network
  const records = Array.from({ length: 100 }, (_, i) => ({ id: 'T-' + String(i + 1).padStart(3, '0'), i }));
  return { records, A: new Set(A), B: new Set(B), C: new Set(C), Cg: new Set(Cg) };
})();

function groupSteps(applied) {
  const P = POPULATION;
  const steps = [{ label: 'Fictional population', from: 'Seeded toy records', set: new Set(P.records.map((r) => r.i)) }];
  const narrow = (label, from, s) => { const prev = steps[steps.length - 1].set; steps.push({ label, from, set: new Set([...prev].filter((i) => s.has(i))) }); };
  narrow('Overnight pharmacy team', 'Interim report ¶2', P.A);
  if (!applied.has('F-03')) narrow('Winter onboarding cohort', 'Case study ¶2, linked by the date in P-07 ¶5', P.B);
  if (applied.has('F-01')) narrow('Moved from another site', 'P-07 ¶2 (revised)', P.Cg);
  else narrow('Transfer from the coastal satellite clinic', 'P-07 ¶2', P.C);
  return steps.map((s) => ({ ...s, count: s.set.size }));
}

/* ---------- derived data ---------- */
const scoreOf = (f) => f.comps.direct + f.comps.specificity + f.comps.cross + f.comps.sensitivity;
function bandOf(f) {
  const s = scoreOf(f);
  let b = s >= 9 ? 'CRITICAL' : s >= 6 ? 'HIGH' : s >= 3 ? 'MODERATE' : 'LOW';
  if (f.override === 'HIGH' && (b === 'LOW' || b === 'MODERATE')) b = 'HIGH';
  return b;
}
const BAND = {
  CRITICAL: { label: 'Critical', cls: 'crit', icon: 'octagon-alert' },
  HIGH: { label: 'High priority', cls: 'high', icon: 'triangle-alert' },
  MODERATE: { label: 'Needs review', cls: 'mod', icon: 'circle-alert' },
  LOW: { label: 'Low', cls: 'low', icon: 'info' },
};
const CONF = { HIGH: 'High confidence', MEDIUM: 'Medium confidence', LOW: 'Low confidence' };

function findings() {
  const sc = S.scenario;
  let list = FINDINGS.map((f) => ({ ...f }));
  if (sc === 'unsupported') list = list.map((f) => (f.source === 'DEVICE' ? { ...f, source: 'FIXTURE' } : f));
  if (sc === 'partial' || sc === 'error') {
    list = list.filter((f) => f.chunk !== 2);
    list.push({
      id: 'F-07', category: null, title: sc === 'error' ? '¶6–8 not assessed: the model reply was malformed' : '¶6–8 not assessed: the local model timed out',
      comps: { direct: 0, specificity: 0, cross: 0, sensitivity: 0 }, confidence: null, source: sc === 'error' ? 'DEVICE' : 'UNAVAILABLE', status: 'UNASSESSED',
      anchors: [{ doc: 'D3', para: 5, quote: '' }],
      rationale: sc === 'error'
        ? 'The reply did not match the findings schema. It was retried once on this device and then set aside. No cloud retry was made.'
        : 'This chunk did not finish within the time limit. It stays not assessed until you run it again. No cloud retry was made.',
      action: 'Run this chunk again', unassessed: true,
    });
  }
  for (const f of list) {
    if (S.statusOverride[f.id]) f.status = S.statusOverride[f.id];
    if (S.applied.has(f.id)) f.status = S.rescanned ? 'RESOLVED' : 'UNDER_REVIEW';
    f.band = f.unassessed ? null : bandOf(f);
    f.score = scoreOf(f);
  }
  return list;
}
const findingById = (id) => findings().find((f) => f.id === id);
const openFindings = () => findings().filter((f) => !['RESOLVED', 'DISMISSED', 'ACCEPTED_RESIDUAL'].includes(f.status));

function draftParas() {
  const paras = [...DOCS.D3.paras];
  for (const f of FINDINGS) if (S.applied.has(f.id) && f.rewrite) paras[f.rewrite.para] = paras[f.rewrite.para].replace(f.rewrite.from, f.rewrite.to);
  return paras;
}
const draftVersion = () => (S.applied.size ? 'v4' : 'v3');

function modelState() {
  if (S.modelPreview) return S.modelPreview;
  return { normal: 'ready', unsupported: 'unsupported', offline: 'offline', partial: 'ready', empty: 'ready', error: 'error' }[S.scenario];
}
const isOffline = () => S.scenario === 'offline';

function journal() {
  const sc = S.scenario;
  let j = JOURNAL.map((e) => ({ ...e }));
  if (sc === 'unsupported') {
    j = j.map((e) => (e.policy === 'ONLY_ON_DEVICE' ? { ...e, src: 'UNAVAILABLE', ms: null, outcome: 'unavailable', note: 'No local model. Marked not assessed. No cloud retry.' } : e));
  }
  if (sc === 'partial') j[1] = { ...j[1], src: 'UNAVAILABLE', ms: 30000, outcome: 'timeout', note: 'Timed out after 30 s. Marked not assessed. No cloud retry.' };
  if (sc === 'error') j[1] = { ...j[1], outcome: 'malformed', note: 'Reply failed schema validation. Retried once on device, then set aside.' };
  if (sc === 'offline') j[4] = { ...j[4], src: 'UNAVAILABLE', ms: null, outcome: 'offline', note: 'Not sent: offline. Using cached pack 2026.11.18-a.' };
  return j.reverse();
}

function markPara(docId, idx, text, opts = {}) {
  let html = esc(text);
  const list = opts.findings || findings();
  for (const f of list) {
    if (S.applied.has(f.id) && docId === 'D3') continue;
    for (const a of f.anchors) {
      if (a.doc !== docId || a.para !== idx || !a.quote) continue;
      const q = esc(a.quote);
      if (!html.includes(q)) continue;
      const active = opts.active === f.id ? ' active' : '';
      html = html.replace(q, `<mark class="ev ev-${f.band ? BAND[f.band].cls : 'un'}${active}" data-f="${f.id}" tabindex="0" role="button" aria-label="${esc(f.title)}">${q}</mark>`);
    }
  }
  return html;
}
function mosaicGrid(steps, stage, opts = {}) {
  // stage: index into steps to show. Tiles eliminated at step k get class out-k.
  const last = steps[Math.min(stage, steps.length - 1)].set;
  const outAt = new Map();
  steps.forEach((s, k) => { if (k === 0) return; for (const i of steps[k - 1].set) if (!s.set.has(i) && !outAt.has(i)) outAt.set(i, k); });
  const tiles = POPULATION.records.map((r) => {
    const k = outAt.get(r.i);
    const state = last.has(r.i) ? 'in' : (k && k <= stage ? `out out-${Math.min(k, 3)}` : 'in');
    return `<i class="tile ${state}" title="${r.id}"></i>`;
  }).join('');
  return `<div class="mosaic${opts.cls ? ' ' + opts.cls : ''}" role="img" aria-label="${last.size} of 100 fictional records remain">${tiles}</div>`;
}

  // 3x3 tesserae, one accent tile: separate pieces that form a picture
  const t = [0, 1, 2].flatMap((y) => [0, 1, 2].map((x) => `<rect x="${x * 8 + 1}" y="${y * 8 + 1}" width="6.4" height="6.4" rx="1.8" class="${x === 2 && y === 0 ? 'lg-a' : (x + y) % 2 ? 'lg-b' : 'lg-c'}"/>`)).join('');
  return `<svg class="logo" width="${size}" height="${size}" viewBox="0 0 25 25" aria-hidden="true">${t}</svg>`;
}
function toast(msg, icon = 'check') {

/* ---------- Liquid Glass refraction (progressive enhancement, 12.4) ---------- */
// Baseline glass is pure CSS. Where Chromium supports SVG filters in
// backdrop-filter, elements marked [data-refract] get an edge-refraction
// displacement map sized to their box.
const Refraction = {
  cache: new Map(),
  svg: null,
  get supported() {
    return typeof window !== 'undefined' && !!window.chrome && !/Firefox|FxiOS/.test(navigator.userAgent) && CSS.supports('backdrop-filter', 'blur(1px)');
  },
  get on() { return S.refraction && !S.reduced && this.supported && !window.matchMedia('(prefers-reduced-transparency: reduce)').matches; },
  ensureSvg() {
    if (this.svg) return this.svg;
    this.svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
    this.svg.setAttribute('width', '0'); this.svg.setAttribute('height', '0');
    this.svg.setAttribute('aria-hidden', 'true');
    this.svg.style.position = 'absolute';
    document.body.appendChild(this.svg);
    return this.svg;
  },
  map(w, h, r, edge) {
    const c = document.createElement('canvas'); c.width = w; c.height = h;
    const ctx = c.getContext('2d'); const img = ctx.createImageData(w, h); const d = img.data;
    const hw = w / 2, hh = h / 2;
    for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
      const px = x + 0.5 - hw, py = y + 0.5 - hh;
      const qx = Math.abs(px) - (hw - r), qy = Math.abs(py) - (hh - r);
      let dist, nx, ny;
      if (qx > 0 && qy > 0) { const L = Math.hypot(qx, qy); dist = L - r; nx = (qx / L) * Math.sign(px); ny = (qy / L) * Math.sign(py); }
      else if (qx > qy) { dist = qx - r; nx = Math.sign(px); ny = 0; }
      else { dist = qy - r; nx = 0; ny = Math.sign(py); }
      const depth = -dist; let m = 0;
      if (depth >= 0 && depth < edge) { const t = 1 - depth / edge; m = t * t * (3 - 2 * t); }
      const i = (y * w + x) * 4;
      d[i] = 128 - nx * m * 127; d[i + 1] = 128 - ny * m * 127; d[i + 2] = 128; d[i + 3] = 255;
    }
    ctx.putImageData(img, 0, 0);
    return c.toDataURL();
  },
  filterFor(w, h, r) {
    const key = `${w}x${h}r${r}`;
    if (this.cache.has(key)) return this.cache.get(key);
    const id = 'lg-' + this.cache.size;
    const edge = Math.min(22, h / 2.2);
    const href = this.map(w, h, r, edge);
    const svg = this.ensureSvg();
    const f = document.createElementNS('http://www.w3.org/2000/svg', 'filter');
    f.setAttribute('id', id);
    f.setAttribute('filterUnits', 'userSpaceOnUse');
    f.setAttribute('x', '0'); f.setAttribute('y', '0'); f.setAttribute('width', w); f.setAttribute('height', h);
    f.setAttribute('color-interpolation-filters', 'sRGB');
    f.innerHTML = `<feGaussianBlur in="SourceGraphic" stdDeviation="5" edgeMode="duplicate" result="b"/>
      <feImage href="${href}" x="0" y="0" width="${w}" height="${h}" preserveAspectRatio="none" result="m"/>
      <feDisplacementMap in="b" in2="m" scale="34" xChannelSelector="R" yChannelSelector="G" result="d"/>
      <feColorMatrix in="d" type="saturate" values="1.7"/>`;
    svg.appendChild(f);
    this.cache.set(key, id);
    return id;
  },
  apply(el) {
    const w = Math.round(el.offsetWidth), h = Math.round(el.offsetHeight);
    if (!w || !h) return;
    const r = Math.min(parseFloat(getComputedStyle(el).borderTopLeftRadius) || 0, h / 2, w / 2);
    const id = this.filterFor(w, h, Math.round(r));
    el.style.backdropFilter = `url(#${id})`;
    el.style.webkitBackdropFilter = `url(#${id})`;
    el.classList.add('refracting');
  },
  clear(el) { el.style.backdropFilter = ''; el.style.webkitBackdropFilter = ''; el.classList.remove('refracting'); },
  scan(root = document) { $$('[data-refract]', root).forEach((el) => (this.on ? this.apply(el) : this.clear(el))); },
  refresh() { requestAnimationFrame(() => this.scan()); },
};
window.addEventListener('resize', () => Refraction.refresh());

function findingInspector(f) {
  if (!f) return `<div class="insp-card"><p class="muted">Select a finding to see its evidence.</p></div>`;
  const cat = f.category ? CATEGORY[f.category] : null;
  const done = ['RESOLVED', 'DISMISSED', 'ACCEPTED_RESIDUAL'].includes(f.status);
  const r = f.rewrite;
  return `
    <div class="insp-card">
      <div class="hstack" style="justify-content:space-between;margin-bottom:8px">${riskChip(f.band)}<span class="small muted mono">${f.id}</span></div>
      <div class="insp-title">${esc(f.title)}</div>
      <div class="hstack" style="margin-top:10px">${sourceBadge(f.source)}${f.source !== 'RULES' ? policyTag('ONLY_ON_DEVICE') : ''}${statusChip(f.status)}</div>
      ${cat ? `<p class="small muted" style="margin-top:8px">${ic(cat.icon, 13)} ${cat.label}</p>` : ''}
      <p style="margin-top:10px;font-size:13.5px;line-height:1.55;color:var(--ink-2)">${esc(f.rationale)}</p>
    </div>
    ${f.unassessed ? `<div class="insp-actions"><button type="button" class="btn btn-primary" data-act="run-chunk">${ic('rotate-cw', 15)} Run ¶6–8 again on this device</button><button type="button" class="btn btn-quiet" data-act="goto" data-doc="D3" data-para="5">Review ¶6–8 by hand</button></div>` : `
    <div class="insp-label">Evidence · ${f.anchors.length} passage${f.anchors.length > 1 ? 's' : ''}</div>
    <div class="ev-list">${f.anchors.map((a) => `<button type="button" class="ev-card" data-act="goto" data-doc="${a.doc}" data-para="${a.para}"><span class="ev-src">${ic(DOCS[a.doc].kind === 'draft' ? 'file-pen' : 'file-check', 12)} ${DOCS[a.doc].title} · ¶${a.para + 1}</span><span class="ev-q">“…${markPara(a.doc, a.para, a.quote, { findings: [f] })}…”</span></button>`).join('')}</div>
    <div class="insp-label">Review priority</div>
    <div class="insp-card">${scoreBars(f)}</div>
    <div class="insp-label">Confidence</div>
    <div class="insp-card"><b style="font-size:13.5px">${CONF[f.confidence]}</b><p class="small" style="color:var(--ink-2);margin-top:4px">${esc(f.confReason)}</p></div>
    ${r ? `<div class="insp-label">Suggested change</div><div class="insp-card"><div class="diffbox"><del class="diff">${esc(r.from)}</del>${r.to ? ` <ins class="diff">${esc(r.to)}</ins>` : ''}</div><div class="keeps" style="margin-top:8px">${ic('circle-check', 14)}<span><b>Still true:</b> ${esc(f.keeps)}</span></div></div>` : ''}
    ${D.dismissing === f.id ? `<div class="insp-label">Why dismiss? (optional, stays on this device)</div><textarea class="note-field" id="dismiss-note" placeholder="For example: already public in the funder’s report"></textarea><div class="insp-actions"><div class="two"><button type="button" class="btn btn-quiet" data-act="dismiss-cancel">Cancel</button><button type="button" class="btn btn-danger" data-act="dismiss" data-id="${f.id}">Dismiss</button></div></div>` : done ? `<div class="insp-actions"><button type="button" class="btn btn-quiet" data-act="reopen" data-id="${f.id}">${ic('undo-2', 15)} Reopen</button></div>` : `
    <div class="insp-actions">
      ${r ? `<button type="button" class="btn btn-primary" data-go="rewrite">${ic('pen-line', 15)} Preview rewrite</button>` : ''}
      <div class="two"><button type="button" class="btn btn-quiet" data-act="residual" data-id="${f.id}">Accept residual</button><button type="button" class="btn btn-quiet" data-act="dismiss-start" data-id="${f.id}">Dismiss…</button></div>
    </div>`}
    <p class="small muted" style="margin:14px 4px 0">Advisory. Mosaic suggests; you decide what to publish.</p>`}`;
}

SCREENS.findings = () => {
  const all = findings();
  const f = D.filter;
  const pass = (x) => f === 'all' || (f === 'high' && (x.band === 'HIGH' || x.band === 'CRITICAL')) || (f === 'mod' && x.band === 'MODERATE') || (f === 'low' && x.band === 'LOW') || (f === 'un' && x.unassessed) || (f === 'device' && x.source === 'DEVICE') || (f === 'rules' && x.source === 'RULES') || (f === 'closed' && ['RESOLVED', 'DISMISSED', 'ACCEPTED_RESIDUAL'].includes(x.status));
  const list = all.filter(pass);
  const n = (fn) => all.filter(fn).length;
  const chips = [['all', 'All', all.length], ['high', 'High priority', n((x) => x.band === 'HIGH')], ['mod', 'Needs review', n((x) => x.band === 'MODERATE')], ['low', 'Low', n((x) => x.band === 'LOW')], ['un', 'Not assessed', n((x) => x.unassessed)], ['device', 'On device', n((x) => x.source === 'DEVICE')], ['rules', 'Rules', n((x) => x.source === 'RULES')], ['closed', 'Closed', n((x) => ['RESOLVED', 'DISMISSED', 'ACCEPTED_RESIDUAL'].includes(x.status))]].filter((c) => c[2] || c[0] === 'all');
  return {
    wide: true,
    body: `
      ${withGap(scenarioBanner('review'))}
      <div class="page-h"><div><h1>Findings</h1><p>P-07 transcript · draft ${draftVersion()} checked against 2 approved releases.</p></div></div>

      <table class="tbl"><thead><tr><th>Priority</th><th>Finding</th><th>Documents</th><th>Source</th><th>Status</th><th class="num">Score</th></tr></thead><tbody>
        ${list.map((x) => { const done = ['RESOLVED', 'DISMISSED', 'ACCEPTED_RESIDUAL'].includes(x.status); return `<tr class="clickable ${x.id === S.selected ? 'sel' : ''} ${done ? 'done' : ''}" data-act="select" data-id="${x.id}" tabindex="0"><td>${riskChip(x.band, { small: true })}</td><td><div class="t-title">${esc(x.title)}</div><div class="small muted">${x.id}${x.category ? ' · ' + CATEGORY[x.category].label : ''}</div></td><td class="small">${[...new Set(x.anchors.map((a) => DOCS[a.doc].short))].join(', ')}</td><td>${sourceBadge(x.source)}</td><td>${statusChip(x.status)}</td><td class="num mono">${x.unassessed ? '—' : x.score + '/11'}</td></tr>`; }).join('')}
      </tbody></table>
      ${list.length ? '' : `<div class="empty-d" style="margin-top:12px"><h3>Nothing in this filter</h3><p>That doesn’t mean the draft is anonymous. It means no finding matches.</p></div>`}
      <p class="small muted" style="margin-top:14px">Scores are review priority from four rubric dimensions, not a probability of identification. A low score is not clearance.</p>`,
    inspectorTitle: 'Finding',
    inspector: findingInspector(findingById(S.selected)),
  };
};

function dGraph() {
  const fs = findings();
  const has = (id) => fs.some((f) => f.id === id);
  const N = DG.nodes;
  const visible = (e) => [e.a, e.b].every((n) => !n.startsWith('F-') || has(n)) && (![e.a, e.b].includes('c4') || has('F-05'));
  const cut = (e) => (e.id === 'e5' && S.applied.has('F-01')) || (e.id === 'e4' && S.applied.has('F-03')) || (e.id === 'e2' && S.applied.has('F-02')) || (e.id === 'e6' && S.applied.has('F-05'));
  const path = (e) => { const a = N[e.a], b = N[e.b]; const x1 = a.x + a.w, y1 = a.y + a.h / 2, x2 = b.x, y2 = b.y + b.h / 2; const mx = (x1 + x2) / 2; return `M${x1} ${y1} C${mx} ${y1}, ${mx} ${y2}, ${x2} ${y2}`; };
  const selE = D.mapSel.type === 'edge' ? D.mapSel.id : null;
  const selN = D.mapSel.type !== 'edge' ? D.mapSel.id : null;
  const edges = G_EDGES.filter(visible).map((e) => `<g><path class="g-hit" d="${path(e)}" data-act="map-sel" data-type="edge" data-id="${e.id}" tabindex="0" role="button" aria-label="${esc(N[e.a].t)} to ${esc(N[e.b].t)}"></path><path class="g-edge${e.hot && !S.applied.has('F-01') ? ' hot' : ''}${cut(e) ? ' cut' : ''}${selE === e.id ? ' sel' : ''}" d="${path(e)}"></path></g>`).join('');
  const nodes = Object.entries(N).filter(([k]) => (!k.startsWith('F-') || has(k)) && (k !== 'c4' || has('F-05'))).map(([k, n]) => {
    const f = k.startsWith('F-') ? fs.find((x) => x.id === k) : null;
    const resolved = f && ['RESOLVED', 'DISMISSED', 'ACCEPTED_RESIDUAL'].includes(f.status);
    const sub = f ? (resolved ? STATUS[f.status].label : BAND[f.band].label) : n.s;
    const mod = f && f.band === 'MODERATE' ? ' mod' : '';
    const type = f ? 'finding' : k.startsWith('c') ? 'cat' : 'doc';
    const big = k === 'F-01';
    return `<g class="g-node ${n.cls}${mod}${resolved ? ' resolved' : ''}${selN === k ? ' sel' : ''}" data-act="map-sel" data-type="${type}" data-id="${k}" tabindex="0" role="button"><rect x="${n.x}" y="${n.y}" width="${n.w}" height="${n.h}" rx="12"></rect>${n.k ? `<text class="kind" x="${n.x + 12}" y="${n.y + 16}">${n.k}</text>` : ''}<text x="${n.x + 12}" y="${n.y + (n.k ? 34 : 22)}">${esc(n.t)}</text><text class="sub" x="${n.x + 12}" y="${n.y + (n.k ? 50 : 38)}">${esc(sub)}</text>${big && !resolved ? `<text class="sub" x="${n.x + 12}" y="${n.y + 72}">Group: ${groupSteps(S.applied).slice(-1)[0].count} of 100 fictional</text>` : ''}</g>`;
  }).join('');
  return `<svg viewBox="0 0 780 372" role="group" aria-label="Disclosure map"><text class="g-col" x="20" y="22">DOCUMENTS</text><text class="g-col" x="300" y="18">CATEGORIES</text><text class="g-col" x="560" y="58">FINDINGS</text>${edges}${nodes}</svg>`;
}

function mapInspector() {
  const sel = D.mapSel;
  const steps = groupSteps(S.applied);
  const st = Math.min(D.mapStage, steps.length - 1);
  let top = '';
  if (sel.type === 'edge') {
    const e = G_EDGES.find((x) => x.id === sel.id);
    top = `<div class="insp-card"><span class="small muted">Connection</span><div class="insp-title" style="font-size:16px;margin-top:4px">${esc(DG.nodes[e.a].t)} → ${esc(DG.nodes[e.b].t)}</div><p style="margin-top:8px;font-size:13.5px;color:var(--ink-2)">${esc(e.reason)}</p></div>
      <div class="insp-label">Passages</div><div class="ev-list">${e.refs.map(([d, p]) => `<button type="button" class="ev-card" data-act="goto" data-doc="${d}" data-para="${p}"><span class="ev-src">${ic(DOCS[d].kind === 'draft' ? 'file-pen' : 'file-check', 12)} ${DOCS[d].title} · ¶${p + 1}</span><span class="ev-q">${markPara(d, p, (d === 'D3' ? draftParas() : DOCS[d].paras)[p])}</span></button>`).join('')}</div>
      <p class="small muted" style="margin:10px 4px 0">A connection is a hypothesis for review, not an identity match.</p>`;
  } else if (sel.type === 'finding') {
    const f = findingById(sel.id);
    top = f ? `<div class="insp-card"><div class="hstack" style="justify-content:space-between">${riskChip(f.band, { small: true })}${sourceBadge(f.source)}</div><div class="insp-title" style="font-size:16px;margin-top:8px">${esc(f.title)}</div><p style="margin-top:8px;font-size:13.5px;color:var(--ink-2)">${esc(f.rationale)}</p><div class="insp-actions"><button type="button" class="btn btn-tinted btn-sm" data-act="select" data-id="${f.id}" data-then="findings">Open in Findings</button></div></div>` : '';
  } else if (sel.type === 'doc') {
    const d = DOCS[sel.id];
    top = `<div class="insp-card"><span class="small muted">${d.kind === 'draft' ? 'Draft' : 'Approved release'}</span><div class="insp-title" style="font-size:16px;margin-top:4px">${d.title}</div><p class="small muted" style="margin-top:6px">${d.meta}</p><div class="insp-actions"><button type="button" class="btn btn-tinted btn-sm" data-act="goto" data-doc="${sel.id}" data-para="0">Open document</button></div></div>`;
  } else {

    top = `<div class="insp-card"><span class="small muted">Generic disclosure category</span><div class="insp-title" style="font-size:16px;margin-top:4px">${n.t}</div><p class="small muted" style="margin-top:6px">A category groups passages that disclose the same kind of context. It never stands for a person.</p></div>`;
  }
  return `${top}
    <div class="insp-label">Fictional group size</div>
    <div class="insp-card">
      <div style="max-width:200px;margin:0 auto 12px">${mosaicGrid(steps, st)}</div>
      <div class="steps">${steps.map((s, k) => `<button type="button" class="step" aria-pressed="${k === st}" data-act="map-stage" data-v="${k}"><span><span class="st-l">${k === 0 ? 'Start' : '+ ' + esc(s.label)}</span><span class="st-s">${esc(s.from)}</span></span><span class="st-n">${s.count}</span></button>`).join('')}</div>

    </div>`;
}

      else if (f.rewrite.to) html = html.replace(esc(f.rewrite.to), `<ins class="diff">${esc(f.rewrite.to)}</ins>`);

/* ---------- modals ---------- */
function openModal(kind, id) {
  closeModal(true);
  let html = '';
  if (kind === 'consent') {
    const body = { ...PACK_REQUEST, domain: D.genDomain, categories: [...D.genCats] };
    html = `<div class="hstack" style="margin-bottom:10px"><span class="pack-src pack-cloud">${ic('cloud', 12)} Generic request</span>${policyTag('ONLY_IN_CLOUD')}</div>
      <h2>Send this request to the cloud?</h2>
      <p style="color:var(--ink-2);font-size:14px">Gemini, through Firebase AI Logic, will write new generic test definitions with fictional examples. This is the complete request:</p>
      <div class="payload" style="margin-top:12px">${esc(JSON.stringify(body, null, 2))}</div>
      <div class="msurf small" style="color:var(--ink-2)"><b style="color:var(--ink)">Not included:</b> document text, excerpts, file names, workspace names, findings and anything derived from them.</div>
      <div class="msurf"><dl class="kv"><dt>Payload digest</dt><dd class="mono">sha256:9f3c…7a1e</dd><dt>Valid for</dt><dd>5 minutes, this exact request</dd><dt>App Check</dt><dd>Required</dd></dl></div>
      <div class="m-actions"><button type="button" class="btn btn-quiet" data-mclose>Cancel</button><button type="button" class="btn btn-primary" data-act="consent-send">${ic('send', 15)} Send this request</button></div>`;
  } else if (kind === 'delete') {
    const all = id === 'all';
    const w = PRIVATE_WORKSPACES.find((x) => x.id === id);
    html = `<h2>${all ? 'Delete all local data?' : `Delete “${esc(w.title)}”?`}</h2>
      <p style="color:var(--ink-2);font-size:14px">${all ? 'This removes every workspace, document, finding, release record and cached pack Mosaic stored in this browser.' : `This removes the workspace and its ${w.docs} documents from this browser.`}</p>
      <div class="msurf small" style="color:var(--ink-2)">It can’t undo exports or copies made elsewhere, and it isn’t forensic erasure.</div>
      <div class="m-actions"><button type="button" class="btn btn-quiet" data-mclose>Cancel</button><button type="button" class="btn btn-danger" data-mclose data-act="toast" data-msg="Preview only: nothing was deleted">${ic('trash-2', 15)} Delete</button></div>`;
  }
  modalsEl.innerHTML = `<div class="modal-scrim" data-mclose></div><div class="modal glass glass-strong" role="dialog" aria-modal="true">${html}</div>`;
  requestAnimationFrame(() => { $('.modal-scrim', modalsEl).classList.add('in'); $('.modal', modalsEl).classList.add('in'); });
}
function closeModal(instant) {
  const m = $('.modal', modalsEl), s = $('.modal-scrim', modalsEl);
  if (!m) return;
  if (instant) { modalsEl.innerHTML = ''; return; }
  m.classList.remove('in'); s.classList.remove('in');
  setTimeout(() => { modalsEl.innerHTML = ''; }, 300);
}

/* ---------- actions ---------- */
function navTo(screen) { D.screen = screen; if (screen !== 'overview') D.blank = false; D.dismissing = null; render(); if (screen === 'landing') playLanding(); }

function act(name, el) {
  const id = el.dataset.id, v = el.dataset.v;
  switch (name) {
    case 'start-sample': D.blank = false; navTo('overview'); break;
    case 'create-ws': D.screen = 'overview'; D.blank = true; render(); break;
    case 'replay': playLanding(); break;
    case 'model-state': setState({ modelPreview: v }); break;
    case 'storage': D.storageMode = v; render(); break;
    case 'rescan': setState({ rescanned: true }); toast(S.applied.size ? 'Reviewed again on this device (preview)' : 'Review ran on this device (preview)', 'scan-search'); break;
    case 'run-chunk': setState({ scenario: 'normal' }); toast('¶6–8 ran again on this device (preview)', 'rotate-cw'); break;
    case 'select': S.selected = id; D.dismissing = null; if (el.dataset.then) { D.screen = el.dataset.then; } render(); break;
    case 'goto': { D.doc = el.dataset.doc; D.gotoPara = Number(el.dataset.para); const f = findings().find((x) => x.anchors.some((a) => a.doc === D.doc && a.para === D.gotoPara && a.quote)); if (f) S.selected = f.id; D.screen = 'document'; render(); break; }
    case 'doc': D.doc = v; render(); break;
    case 'apply': { const a = new Set(S.applied); a.add(id); setState({ applied: a, rescanned: false, approved: false }); toast(`Applied ${id} · draft v4 created`, 'pen-line'); break; }
    case 'undo': { const a = new Set(S.applied); a.delete(id); setState({ applied: a, rescanned: false, approved: false }); toast(`Undid ${id}`, 'undo-2'); break; }
    case 'dismiss-start': D.dismissing = id; render(); setTimeout(() => $('#dismiss-note')?.focus(), 30); break;
    case 'dismiss-cancel': D.dismissing = null; render(); break;
    case 'dismiss': D.dismissing = null; setState({ statusOverride: { ...S.statusOverride, [id]: 'DISMISSED' } }); toast(`${id} dismissed`, 'circle-slash'); break;
    case 'residual': setState({ statusOverride: { ...S.statusOverride, [id]: 'ACCEPTED_RESIDUAL' } }); toast(`${id} accepted as residual`, 'circle-check-big'); break;
    case 'reopen': { const o = { ...S.statusOverride }; delete o[id]; const a = new Set(S.applied); a.delete(id); setState({ statusOverride: o, applied: a }); toast(`${id} reopened`, 'undo-2'); break; }
    case 'filter': D.filter = v; render(); break;
    case 'map-mode': D.mapMode = v; render(); break;
    case 'map-stage': D.mapStage = Number(v); render(); break;
    case 'map-sel': D.mapSel = { type: el.dataset.type, id }; render(); break;
    case 'check': { const c = [...S.checklist]; c[Number(v)] = !c[Number(v)]; setState({ checklist: c }); break; }
    case 'approve': setState({ approved: true }); toast('Approved in this browser', 'stamp'); break;
    case 'revoke': setState({ approved: false, checklist: [false, false, false] }); toast('Approval revoked', 'undo-2'); break;
    case 'pack-expand': D.expandedPack = D.expandedPack === v ? null : v; render(); break;
    case 'pack-toggle': setState({ packsEnabled: { ...S.packsEnabled, [v]: el.checked } }); break;
    case 'gen-domain': D.genDomain = v; render(); break;
    case 'gen-cat': D.genCats.has(v) ? D.genCats.delete(v) : D.genCats.add(v); render(); break;
    case 'consent-send': closeModal(); setState({ consent: 'sent' }); toast('Design preview: no request was sent', 'cloud'); break;
    case 'export-kind': D.exportKind = v; render(); break;
    case 'export-fmt': D.exportFmt = v; render(); break;
    case 'j-sel': D.journalSel = Number(v); render(); break;
    case 'hist-sel': D.historySel = v; render(); break;
    case 'theme': setState({ appearance: v }); break;
    case 'pref-reduced': setState({ reduced: el.checked }); break;
    case 'pref-refraction': setState({ refraction: el.checked }); break;
    case 'session-only': D.sessionOnly = el.checked; break;
    case 'toast': toast(el.dataset.msg || 'Preview only', 'info'); break;
    default: break;
  }
}

$('#win').addEventListener('click', (e) => {
  const t = e.target;
  if (t.closest('[data-mclose]')) { closeModal(); }
  const modal = t.closest('[data-modal]');
  const actEl = t.closest('[data-act]');
  const goEl = t.closest('[data-go]');
  const mark = t.closest('mark.ev[data-f]');
  if (actEl && actEl.tagName === 'INPUT') return;
  if (t.closest('a[href="#"]')) e.preventDefault();
  if (modal && !modal.disabled) return openModal(modal.dataset.modal, modal.dataset.id);
  if (mark && !t.closest('.ev-card')) { S.selected = mark.dataset.f; D.dismissing = null; render(); return; }
  if (actEl) return act(actEl.dataset.act, actEl);
  if (goEl) {
    if (goEl.dataset.filter) D.filter = goEl.dataset.filter;
    if (goEl.dataset.doc) D.doc = goEl.dataset.doc;
    navTo(goEl.dataset.go);
  }
});
$('#win').addEventListener('change', (e) => { const a = e.target.closest('[data-act]'); if (a && a.tagName === 'INPUT') act(a.dataset.act, a); });
$('#win').addEventListener('dragover', (e) => { if (D.screen === 'import') { e.preventDefault(); if (!D.dragOver) { D.dragOver = true; $('#drop')?.classList.add('over'); } } });
$('#win').addEventListener('dragleave', () => { D.dragOver = false; $('#drop')?.classList.remove('over'); });
$('#win').addEventListener('drop', (e) => { if (D.screen === 'import') { e.preventDefault(); D.dragOver = false; $('#drop')?.classList.remove('over'); toast('Preview: files are not read on this page', 'info'); } });
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') closeModal();
  if (e.target.matches('input, textarea, select')) return;
  if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('mark.ev[data-f], g[role="button"], path[role="button"], tr[data-act]')) { e.preventDefault(); e.target.dispatchEvent(new MouseEvent('click', { bubbles: true })); return; }
  if (D.screen === 'document' && (e.key === 'j' || e.key === 'k')) {
    const fl = findings().filter((f) => f.anchors.some((a) => a.doc === D.doc && a.quote));
    if (!fl.length) return;
    let i = fl.findIndex((f) => f.id === S.selected);
    i = (i + (e.key === 'j' ? 1 : fl.length - 1)) % fl.length;
    S.selected = fl[i].id;
    render();
    const mk = $(`mark[data-f="${S.selected}"]`);
    if (mk) { mk.scrollIntoView({ block: 'center', behavior: reduceMotion() ? 'auto' : 'smooth' }); mk.classList.add('flash'); }
  }
});

/* ---------- landing animation ---------- */
let landingTimer = null;
const CAPS = ['A fictional population of 100 people.', 'The March report narrows it to one team.', 'The June case study narrows it again.', 'The new draft leaves one person.'];
function playLanding() {
  clearInterval(landingTimer);
  const steps = groupSteps(new Set());
  const paint = () => {
    const grid = $('.l-reveal .mosaic'); if (!grid) return false;
    grid.outerHTML = mosaicGrid(steps, D.landingStage);
    $('#l-count').innerHTML = `${steps[D.landingStage].count}<small> of 100</small>`;
    $('#l-cap').textContent = CAPS[D.landingStage];
    $$('.l-doc').forEach((d, i) => d.classList.toggle('lit', i < D.landingStage));
    return true;
  };
  if (reduceMotion()) { D.landingStage = 3; paint(); return; }
  D.landingStage = 0; paint();
  landingTimer = setInterval(() => {
    if (D.screen !== 'landing') return clearInterval(landingTimer);
    D.landingStage++;
    paint();
    if (D.landingStage >= 3) clearInterval(landingTimer);
  }, 1300);
}

/* ---------- backdrop tesserae (gives the glass something to bend) ---------- */
function paintBackdrop() {
  let seed = 7;
  const rnd = () => { seed = (seed * 16807) % 2147483647; return seed / 2147483647; };
  const W = 1800, H = 1200, cell = 120;
  let out = '';
  for (let y = 0; y < H; y += cell) for (let x = 0; x < W; x += cell) {
    if (rnd() < 0.45) continue;
    const s = cell * (0.55 + rnd() * 0.4);
    const ox = x + rnd() * (cell - s), oy = y + rnd() * (cell - s);
    out += `<rect x="${ox.toFixed(1)}" y="${oy.toFixed(1)}" width="${s.toFixed(1)}" height="${s.toFixed(1)}" rx="${(s * 0.18).toFixed(1)}" class="t${1 + Math.floor(rnd() * 3)}" transform="rotate(${((rnd() - 0.5) * 8).toFixed(1)} ${(ox + s / 2).toFixed(1)} ${(oy + s / 2).toFixed(1)})"/>`;
  }
  const svg = $('#backdrop');
  svg.setAttribute('viewBox', `0 0 ${W} ${H}`);
  svg.setAttribute('preserveAspectRatio', 'xMidYMid slice');
  svg.innerHTML = out;
}

/* ---------- fit the window to the viewport ---------- */
const MIN_W = 1180;
function fit() {
  const vp = $('#viewport'), win = $('#win');
  const w = vp.clientWidth, h = vp.clientHeight;
  if (w >= MIN_W) { win.style.width = w + 'px'; win.style.height = h + 'px'; win.style.transform = ''; }
  else { const s = w / MIN_W; win.style.width = MIN_W + 'px'; win.style.height = h / s + 'px'; win.style.transform = `scale(${s})`; }
  Refraction.refresh();
}
window.addEventListener('resize', fit);

/* ---------- boot ---------- */
function renderPreview() { $('#pv').innerHTML = previewControls(D.screen); }
onState(() => { renderPreview(); render(); });
bindPreviewControls($('#pv'), (screen) => { closeModal(true); if (screen === 'overview') D.blank = false; navTo(screen); });
applyAppearance();
renderPreview();
paintBackdrop();
fit();
render();
playLanding();
</script>
