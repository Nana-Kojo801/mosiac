/* ===== base ===== */
*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-ui); -webkit-font-smoothing: antialiased; }
#app-root { background: var(--bg); color: var(--ink); font-family: var(--font-ui); font-size: var(--fs-subhead); line-height: 1.4; min-height: 100%; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2.5px solid var(--focus); outline-offset: 2px; border-radius: 8px; }
.ic { flex: none; display: inline-block; vertical-align: middle; }
.mono, code, kbd { font-family: var(--font-mono); font-size: 0.86em; }
.tnum { font-variant-numeric: tabular-nums; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
h1, h2, h3, h4 { margin: 0; text-wrap: balance; letter-spacing: -0.01em; }
p { margin: 0; }

.logo .lg-a { fill: var(--accent); }
.logo .lg-b { fill: var(--ink); opacity: 0.82; }
.logo .lg-c { fill: var(--ink); opacity: 0.34; }

/* ===== Liquid Glass (12.4) ===== */
.glass {
  position: relative;
  background: var(--glass-tint);
  -webkit-backdrop-filter: blur(var(--glass-blur)) saturate(var(--glass-sat));
  backdrop-filter: blur(var(--glass-blur)) saturate(var(--glass-sat));
  box-shadow: var(--glass-shadow), inset 0 1px 0 0 var(--glass-rim), 0 0 0 0.5px var(--glass-rim-outer);
  isolation: isolate;
}
.glass::before {
  /* specular edge highlight: brighter top-left and bottom-right rims */
  content: ""; position: absolute; inset: 0; border-radius: inherit; padding: 1px; pointer-events: none; z-index: 1;
  background: linear-gradient(135deg, var(--glass-spec-a) 0%, transparent 32%, transparent 68%, var(--glass-spec-b) 100%);
  -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
  -webkit-mask-composite: xor; mask-composite: exclude;
}
.glass-strong { background: var(--glass-tint-strong); }
.glass.refracting { background: var(--glass-tint-strong); }
.glass-flat { box-shadow: inset 0 -0.5px 0 var(--hairline-strong); }
.glass-flat::before { display: none; }

@supports not ((backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px))) {
  .glass { background: var(--glass-opaque); }
}
[data-transparency="reduced"] .glass,
[data-transparency="reduced"] .glass-strong { background: var(--glass-opaque) !important; -webkit-backdrop-filter: none !important; backdrop-filter: none !important; }
[data-transparency="reduced"] .glass::before { display: none; }
@media (prefers-reduced-transparency: reduce) {
  .glass, .glass-strong { background: var(--glass-opaque) !important; -webkit-backdrop-filter: none !important; backdrop-filter: none !important; }
  .glass::before { display: none; }
}
@media (prefers-contrast: more) {
  .glass, .glass-strong { background: var(--glass-opaque) !important; -webkit-backdrop-filter: none !important; backdrop-filter: none !important; box-shadow: 0 0 0 1.5px var(--ink) !important; }
  .glass::before { display: none; }
  .chip, .src, .status { box-shadow: inset 0 0 0 1px currentColor; }
}

/* ===== buttons ===== */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 44px; padding: 0 18px; border-radius: 999px; font-weight: 600; font-size: var(--fs-subhead); white-space: nowrap; transition: transform var(--dur-1) var(--ease-out), background var(--dur-1); }
.btn:active { transform: scale(0.97); }
.btn-primary { background: var(--accent); color: var(--accent-ink); }
.btn-tinted { background: var(--accent-soft); color: var(--accent-text); }
.btn-plain { color: var(--accent-text); padding: 0 10px; }
.btn-quiet { background: var(--surface-sunk); color: var(--ink); }
.btn-danger { background: var(--risk-crit-bg); color: var(--risk-crit-fg); }
.btn-sm { min-height: 34px; padding: 0 14px; font-size: var(--fs-footnote); }
.btn[disabled], .btn[aria-disabled="true"] { opacity: 0.42; pointer-events: none; }
.icon-btn { display: inline-grid; place-items: center; width: 44px; height: 44px; border-radius: 999px; color: var(--ink); }
.icon-btn.glass { width: 40px; height: 40px; }

/* ===== chips: risk always pairs icon + text + color ===== */
.chip, .src, .status, .pack-src { display: inline-flex; align-items: center; gap: 5px; border-radius: 999px; font-weight: 600; white-space: nowrap; line-height: 1; }
.chip { padding: 5px 9px 5px 7px; font-size: var(--fs-caption); }
.chip-sm { padding: 3px 7px 3px 5px; }
.chip-low { color: var(--risk-low-fg); background: var(--risk-low-bg); }
.chip-mod { color: var(--risk-mod-fg); background: var(--risk-mod-bg); }
.chip-high { color: var(--risk-high-fg); background: var(--risk-high-bg); }
.chip-crit { color: var(--risk-crit-fg); background: var(--risk-crit-bg); }
.chip-unassessed { color: var(--unassessed-fg); background: var(--unassessed-bg); }
.chip-ok { color: var(--ok-fg); background: var(--ok-bg); }
.src { padding: 4px 8px 4px 6px; font-size: var(--fs-micro); letter-spacing: 0.01em; }
.src-device { color: var(--src-device-fg); background: var(--src-device-bg); }
.src-cloud { color: var(--src-cloud-fg); background: var(--src-cloud-bg); }
.src-rules, .src-unknown { color: var(--src-rules-fg); background: var(--src-rules-bg); }
.src-unavail { color: var(--unassessed-fg); background: var(--unassessed-bg); }
.src-fixture { color: var(--ink-2); background: transparent; box-shadow: inset 0 0 0 1px var(--hairline-strong); }
.status { font-size: var(--fs-caption); color: var(--ink-2); font-weight: 500; }
.status-resolved { color: var(--ok-fg); }
.status-unassessed { color: var(--unassessed-fg); }
.status-under_review { color: var(--accent-text); }
.pack-src { padding: 3px 7px 3px 6px; font-size: var(--fs-micro); color: var(--ink-2); background: var(--surface-sunk); }
.pack-cloud { color: var(--src-cloud-fg); background: var(--src-cloud-bg); }
.policy { font-size: var(--fs-micro); padding: 2px 6px; border-radius: 6px; background: var(--surface-sunk); color: var(--ink-2); letter-spacing: 0; }
.preview-flag { display: inline-flex; align-items: center; gap: 6px; font-size: var(--fs-micro); font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--ink-3); }

/* ===== evidence marks ===== */
mark.ev { background: var(--mark-bg); color: inherit; border-radius: 4px; padding: 1px 2px; box-shadow: inset 0 -2px 0 var(--mark-line); cursor: pointer; transition: background var(--dur-1); }
mark.ev:hover, mark.ev.active { background: var(--mark-active-bg); }
mark.ev-high, mark.ev-crit { --mark-line: var(--risk-high-fg); }
mark.ev-low { --mark-line: var(--ink-3); background: var(--surface-sunk); }
mark.ev.flash { animation: flash 1.1s var(--ease-out); }
@keyframes flash { 0%, 40% { box-shadow: inset 0 -2px 0 var(--mark-line), 0 0 0 4px var(--mark-active-bg); } 100% { box-shadow: inset 0 -2px 0 var(--mark-line), 0 0 0 0 transparent; } }
.para { position: relative; }
.para-anchor { font-family: var(--font-mono); font-size: var(--fs-micro); color: var(--ink-3); user-select: none; }
del.diff, ins.diff { text-decoration: none; border-radius: 4px; padding: 1px 3px; }
del.diff { background: var(--diff-del-bg); color: var(--diff-del-fg); text-decoration: line-through; text-decoration-thickness: 1px; }
ins.diff { background: var(--diff-add-bg); color: var(--diff-add-fg); }

/* ===== score ===== */
.score { display: grid; gap: 8px; }
.score-row { display: grid; grid-template-columns: 1fr auto 32px; align-items: center; gap: 10px; font-size: var(--fs-footnote); color: var(--ink-2); }
.score-pips { display: inline-flex; gap: 3px; }
.score-pips i { width: 16px; height: 6px; border-radius: 3px; background: var(--surface-sunk); box-shadow: inset 0 0 0 0.5px var(--hairline-strong); }
.score-pips i.on { background: var(--ink-2); box-shadow: none; }
.score-num { font-family: var(--font-mono); font-size: var(--fs-micro); text-align: right; color: var(--ink-3); }
.score-total { display: flex; justify-content: space-between; align-items: baseline; padding-top: 8px; border-top: 0.5px solid var(--hairline-strong); font-size: var(--fs-footnote); color: var(--ink-2); }
.score-total strong { font-size: var(--fs-title-3); color: var(--ink); font-variant-numeric: tabular-nums; }
.score-total small { font-size: var(--fs-footnote); color: var(--ink-3); font-weight: 500; }

/* ===== mosaic (fictional group-size illustration) ===== */
.mosaic { display: grid; grid-template-columns: repeat(10, 1fr); gap: 3px; aspect-ratio: 1; max-width: 100%; }
.mosaic .tile { border-radius: 3px; background: var(--accent); transition: opacity var(--dur-3) var(--ease-out), transform var(--dur-3) var(--spring), background var(--dur-3); }
.mosaic .tile.out { background: var(--ink-3); opacity: 0.16; transform: scale(0.72); }
.mosaic .tile.out-1 { opacity: 0.22; }
.mosaic .tile.out-2 { opacity: 0.16; }
.mosaic .tile.out-3 { opacity: 0.11; }
.illustrative { display: inline-flex; align-items: center; gap: 5px; font-size: var(--fs-micro); color: var(--ink-3); font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; }

/* ===== switches & segmented ===== */
.switch { position: relative; width: 51px; height: 31px; flex: none; }
.switch input { position: absolute; inset: 0; opacity: 0; margin: 0; cursor: pointer; z-index: 1; }
.switch span { position: absolute; inset: 0; border-radius: 999px; background: var(--surface-sunk); box-shadow: inset 0 0 0 0.5px var(--hairline-strong); transition: background var(--dur-2); }
.switch span::after { content: ""; position: absolute; top: 2px; left: 2px; width: 27px; height: 27px; border-radius: 50%; background: #fff; box-shadow: 0 2px 6px rgba(0,0,0,.18), 0 0 0 0.5px rgba(0,0,0,.06); transition: transform var(--dur-2) var(--spring); }
.switch input:checked + span { background: var(--ok-fg); }
.switch input:checked + span::after { transform: translateX(20px); }
.switch input:focus-visible + span { outline: 2.5px solid var(--focus); outline-offset: 2px; }
.seg { display: inline-flex; padding: 2px; border-radius: 10px; background: var(--surface-sunk); gap: 2px; }
.seg button { min-height: 30px; padding: 0 12px; border-radius: 8px; font-size: var(--fs-footnote); font-weight: 600; color: var(--ink-2); }
.seg button[aria-pressed="true"], .seg button[aria-selected="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 3px rgba(0,0,0,.12), 0 0 0 0.5px var(--hairline); }

/* ===== code / payload ===== */
.payload { font-family: var(--font-mono); font-size: 12.5px; line-height: 1.55; background: var(--surface-sunk); border-radius: 12px; padding: 12px 14px; overflow-x: auto; white-space: pre; color: var(--ink); box-shadow: inset 0 0 0 0.5px var(--hairline-strong); }
.payload .k { color: var(--accent-text); }
.payload .s { color: var(--src-device-fg); }

/* ===== banners ===== */
.banner { display: flex; gap: 10px; align-items: flex-start; padding: 12px 14px; border-radius: 14px; font-size: var(--fs-footnote); line-height: 1.45; }
.banner .ic { margin-top: 1px; }
.banner strong { display: block; font-size: var(--fs-subhead); margin-bottom: 2px; }
.banner-warn { background: var(--risk-mod-bg); color: var(--risk-mod-fg); }
.banner-info { background: var(--accent-soft); color: var(--accent-text); }
.banner-neutral { background: var(--surface-sunk); color: var(--ink-2); }
.banner-bad { background: var(--risk-crit-bg); color: var(--risk-crit-fg); }
.banner-un { background: var(--unassessed-bg); color: var(--unassessed-fg); }
.banner .banner-body { flex: 1; min-width: 0; }
.banner .btn { margin-top: 8px; }

/* ===== toast ===== */
#toast-host { position: fixed; left: 50%; bottom: max(24px, env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); display: grid; gap: 8px; z-index: 200; pointer-events: none; }
.toast { display: flex; align-items: center; gap: 8px; padding: 10px 16px; border-radius: 999px; font-size: var(--fs-footnote); font-weight: 600; animation: toast-in var(--dur-2) var(--spring); }
.toast.out { opacity: 0; transform: translateY(8px); transition: all var(--dur-2); }
@keyframes toast-in { from { opacity: 0; transform: translateY(12px) scale(0.96); } }

/* ===== preview control panel (design-tool chrome, deliberately plain) ===== */
.pv { font-family: var(--font-ui); font-size: 13px; color: var(--ink); display: grid; gap: 6px; align-content: start; }
.pv-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.pv-tag { font-family: var(--font-mono); font-size: 11px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; padding: 4px 8px; border: 1.5px dashed var(--ink-3); border-radius: 6px; color: var(--ink-2); }
.pv-ver { font-family: var(--font-mono); font-size: 11px; color: var(--ink-3); }
.pv-note { color: var(--ink-2); font-size: 12px; line-height: 1.45; margin-bottom: 6px; }
.pv-hint { color: var(--ink-3); font-size: 11.5px; line-height: 1.4; }
.pv-label { font-size: 11px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: var(--ink-3); margin-top: 8px; }
.pv-select { width: 100%; min-height: 36px; border-radius: 8px; border: 1px solid var(--hairline-strong); background: var(--surface); padding: 0 10px; font-size: 13px; }
.pv-seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; padding: 2px; border-radius: 8px; background: var(--surface-sunk); }
.pv-seg button { min-height: 30px; border-radius: 6px; font-size: 12.5px; font-weight: 600; color: var(--ink-2); }
.pv-seg button[aria-checked="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,.12); }
.pv-switch { display: flex; align-items: center; gap: 8px; min-height: 32px; font-size: 13px; cursor: pointer; }
.pv-switch input { width: 16px; height: 16px; accent-color: var(--accent); }
.pv-reset { display: inline-flex; align-items: center; gap: 6px; margin-top: 8px; min-height: 34px; padding: 0 12px; border-radius: 8px; border: 1px solid var(--hairline-strong); font-size: 12.5px; font-weight: 600; justify-self: start; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: 1ms !important; transition-duration: 1ms !important; }
}

/* ===== stage (preview chrome around the phone) ===== */
.stage { min-height: 100vh; display: grid; grid-template-columns: minmax(220px, 260px) auto minmax(220px, 300px); justify-content: center; align-items: start; gap: 40px; padding-block: 28px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  background:
    radial-gradient(1200px 600px at 50% -10%, var(--tile-a), transparent 70%),
    var(--bg-deep); }
.pv-panel { position: sticky; top: 28px; background: var(--surface); border-radius: 16px; padding: 16px; box-shadow: 0 0 0 0.5px var(--hairline-strong); }
.device-col { display: grid; justify-items: center; gap: 12px; }
.device-scaler { width: 393px; height: 852px; transform-origin: top center; }
.device-caption { font-size: 12px; color: var(--ink-3); text-align: center; }
.notes { position: sticky; top: 28px; font-size: 13px; color: var(--ink-2); line-height: 1.5; display: grid; gap: 10px; }
.notes h2 { font-size: 15px; color: var(--ink); }
.notes ul { margin: 0; padding-left: 18px; display: grid; gap: 4px; }
.notes .spec { font-family: var(--font-mono); font-size: 11px; color: var(--ink-3); }
.pv-fab { display: none; }

@media (max-width: 1100px) {
  .stage { grid-template-columns: minmax(220px, 260px) auto; }
  .notes { display: none; }
}
/* phone-width viewing: the app fills the screen, controls move to a drawer */
@media (max-width: 720px) {
  .stage { display: block; padding: 0; background: var(--bg); }
  .device-col { display: block; }
  .device-scaler { width: 100% !important; height: 100vh !important; height: 100dvh !important; transform: none !important; }
  .device { width: 100% !important; height: 100% !important; border-radius: 0 !important; box-shadow: none !important; }
  .device-caption { display: none; }
  .pv-panel { position: fixed; z-index: 300; left: 0; right: 0; bottom: 0; top: auto; border-radius: 18px 18px 0 0; max-height: 78vh; overflow-y: auto; transform: translateY(105%); transition: transform var(--dur-2) var(--ease-out); padding-bottom: max(16px, env(safe-area-inset-bottom, 0px)); box-shadow: 0 -10px 40px rgba(0,0,0,.25); }
  .pv-panel.open { transform: none; }
  .pv-fab { display: block; position: fixed; z-index: 301; right: max(12px, env(safe-area-inset-right, 0px)); top: calc(env(safe-area-inset-top, 0px) + 56px); font: 700 11px/1 var(--font-mono); letter-spacing: .06em; text-transform: uppercase; padding: 8px 10px; border-radius: 8px; background: var(--surface); color: var(--ink-2); border: 1.5px dashed var(--ink-3); }
  .statusbar { display: none !important; }
}

/* ===== device ===== */
.device { position: relative; width: 393px; height: 852px; border-radius: 54px; overflow: hidden; background: var(--bg); box-shadow: 0 0 0 11px var(--ink), 0 0 0 12.5px var(--ink-3), 0 40px 80px -20px rgba(15, 20, 40, 0.45); isolation: isolate; container-type: inline-size; }
.statusbar { position: absolute; z-index: 60; top: 0; left: 0; right: 0; height: 54px; display: flex; align-items: center; justify-content: space-between; padding: 0 30px 0 38px; font-weight: 600; font-size: 16px; pointer-events: none; }
.sb-island { position: absolute; left: 50%; top: 11px; width: 120px; height: 35px; margin-left: -60px; border-radius: 20px; background: #000; }
.sb-icons { display: inline-flex; gap: 6px; align-items: center; }

/* ===== navigation stack ===== */
.stack { position: absolute; inset: 0; }
.screen { position: absolute; inset: 0; background: var(--bg); display: flex; flex-direction: column; will-change: transform; }
.screen .scroll { flex: 1; overflow-y: auto; overflow-x: hidden; overscroll-behavior: contain; padding: 104px 16px 120px; scrollbar-width: none; }
.screen .scroll::-webkit-scrollbar { display: none; }
.screen.no-tabbar .scroll { padding-bottom: 110px; }
.screen.no-large .scroll { padding-top: 108px; }

/* top bar: floating glass buttons + scroll-edge effect; title collapses */
.topbar { position: absolute; z-index: 20; top: 0; left: 0; right: 0; height: 104px; padding: 54px 12px 0; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; pointer-events: none; }
.topbar > * { pointer-events: auto; }
.topbar .edge { position: absolute; inset: 0 0 -18px; z-index: -1; pointer-events: none; opacity: 0; transition: opacity var(--dur-2);
  background: linear-gradient(to bottom, var(--bg) 0%, color-mix(in srgb, var(--bg) 70%, transparent) 60%, transparent 100%);
  -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px);
  -webkit-mask-image: linear-gradient(to bottom, #000 62%, transparent); mask-image: linear-gradient(to bottom, #000 62%, transparent); }
.screen.collapsed .topbar .edge, .screen.no-large .topbar .edge { opacity: 1; }
.topbar .t-left { justify-self: start; display: flex; gap: 8px; }
.topbar .t-right { justify-self: end; display: flex; gap: 8px; }
.topbar .t-title { font-size: var(--fs-headline); font-weight: 600; opacity: 0; transform: translateY(6px); transition: opacity var(--dur-2), transform var(--dur-2) var(--ease-out); text-align: center; max-width: 200px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.topbar .t-sub { display: block; font-size: var(--fs-micro); font-weight: 500; color: var(--ink-3); }
.screen.collapsed .t-title, .screen.no-large .t-title { opacity: 1; transform: none; }
.gbtn { display: inline-flex; align-items: center; justify-content: center; gap: 4px; height: 44px; min-width: 44px; padding: 0 12px; border-radius: 999px; font-size: var(--fs-callout); font-weight: 600; color: var(--ink); }
.gbtn.round { width: 44px; padding: 0; }
.gbtn.accent { color: var(--accent-text); }
.gbtn.primary { background: var(--accent); color: var(--accent-ink); box-shadow: 0 6px 16px -6px color-mix(in srgb, var(--accent) 70%, transparent); }
.gbtn.primary::before { display: none; }
.large-title { font-size: var(--fs-large-title); font-weight: 700; letter-spacing: -0.02em; line-height: 1.15; margin: 4px 4px 2px; transition: opacity var(--dur-1); }
.large-sub { margin: 0 4px 18px; color: var(--ink-2); font-size: var(--fs-subhead); }
.screen.collapsed .large-title { opacity: 0; }

/* ===== tab bar (floating glass) ===== */
.tabbar { position: absolute; z-index: 40; left: 14px; right: 14px; bottom: 22px; height: 64px; border-radius: 32px; display: grid; grid-template-columns: repeat(5, 1fr); align-items: center; padding: 0 6px; transition: transform var(--dur-3) var(--spring), opacity var(--dur-2); }
.tabbar.hidden { transform: translateY(120px); opacity: 0; pointer-events: none; }
.tab { position: relative; z-index: 2; display: grid; justify-items: center; gap: 2px; height: 54px; align-content: center; border-radius: 27px; font-size: 10.5px; font-weight: 600; color: var(--ink-2); }
.tab[aria-current="page"] { color: var(--accent-text); background: color-mix(in srgb, var(--surface) 78%, transparent); box-shadow: 0 1px 3px rgba(0,0,0,.08), inset 0 0 0 0.5px var(--hairline); }
[data-transparency="reduced"] .tab[aria-current="page"] { background: var(--accent-soft); }
.tab .ic { width: 22px; height: 22px; }
.tab .badge { position: absolute; top: 5px; left: calc(50% + 6px); min-width: 17px; height: 17px; padding: 0 4px; border-radius: 9px; background: var(--risk-high-fg); color: #fff; font-size: 10.5px; line-height: 17px; text-align: center; font-weight: 700; }

/* bottom toolbar for pushed detail screens */
.toolbar { position: absolute; z-index: 40; left: 14px; right: 14px; bottom: 22px; min-height: 60px; border-radius: 30px; display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 8px; }
.toolbar .tb-mid { font-size: var(--fs-footnote); font-weight: 600; color: var(--ink-2); text-align: center; flex: 1; position: relative; z-index: 2; }
.toolbar > * { position: relative; z-index: 2; }

/* ===== content primitives ===== */
.section-h { display: flex; align-items: baseline; justify-content: space-between; margin: 22px 4px 8px; }
.section-h h2 { font-size: var(--fs-title-3); font-weight: 700; }
.section-h .btn-plain { min-height: 30px; font-size: var(--fs-subhead); font-weight: 500; padding: 0; }
.eyebrow { font-size: var(--fs-footnote); font-weight: 600; color: var(--ink-3); text-transform: uppercase; letter-spacing: 0.04em; margin: 22px 16px 6px; }
.group { background: var(--surface); border-radius: 18px; overflow: hidden; }
.group + .foot, .foot { font-size: var(--fs-footnote); color: var(--ink-3); margin: 6px 16px 0; line-height: 1.4; }
.row { position: relative; display: flex; align-items: center; gap: 12px; min-height: 52px; padding: 10px 16px; width: 100%; text-align: left; background: var(--surface); }
.row + .row::before { content: ""; position: absolute; top: 0; right: 0; left: 56px; height: 0.5px; background: var(--hairline-strong); }
.row.plain + .row.plain::before { left: 16px; }
.row .r-ic { width: 30px; height: 30px; border-radius: 8px; display: grid; place-items: center; flex: none; background: var(--surface-sunk); color: var(--ink-2); }
.row .r-ic.accent { background: var(--accent-soft); color: var(--accent-text); }
.row .r-main { flex: 1; min-width: 0; }
.row .r-title { display: block; font-size: var(--fs-body); font-weight: 400; color: var(--ink); line-height: 1.3; }
.row .r-sub { display: block; font-size: var(--fs-footnote); color: var(--ink-3); margin-top: 2px; }
.row .r-end { display: flex; align-items: center; gap: 6px; color: var(--ink-3); font-size: var(--fs-subhead); flex: none; }
.row.danger .r-title { color: var(--risk-crit-fg); }
button.row:active, a.row:active { background: var(--surface-2); }
.card { background: var(--surface); border-radius: 20px; padding: 16px; }
.card + .card { margin-top: 12px; }
.stack-12 { display: grid; gap: 12px; }
.hstack { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.muted { color: var(--ink-3); }
.small { font-size: var(--fs-footnote); }
.cta-col { display: grid; gap: 10px; margin-top: 18px; }
.cta-col .btn { min-height: 52px; font-size: var(--fs-callout); }

/* search */
.search { display: flex; align-items: center; gap: 8px; height: 40px; padding: 0 12px; border-radius: 12px; background: var(--surface-sunk); color: var(--ink-3); margin: 0 0 6px; }
.search input { border: 0; background: transparent; outline: none; flex: 1; font-size: var(--fs-body); color: var(--ink); min-width: 0; }

/* chips row (filters) */
.filters { display: flex; gap: 8px; overflow-x: auto; margin: 0 -16px 10px; padding: 2px 16px 6px; scrollbar-width: none; }
.filters::-webkit-scrollbar { display: none; }
.fchip { flex: none; display: inline-flex; align-items: center; gap: 6px; height: 34px; padding: 0 12px; border-radius: 17px; background: var(--surface); color: var(--ink-2); font-size: var(--fs-footnote); font-weight: 600; box-shadow: inset 0 0 0 0.5px var(--hairline-strong); }
.fchip[aria-pressed="true"] { background: var(--ink); color: var(--bg); box-shadow: none; }
.fchip .n { font-variant-numeric: tabular-nums; opacity: 0.7; }

/* ===== landing ===== */
.landing .scroll { padding-top: 66px; }
.brand { display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 17px; letter-spacing: -0.01em; margin: 0 4px; }
.brand .preview-flag { margin-left: auto; }
.hero-title { font-size: 32px; line-height: 1.12; font-weight: 750; letter-spacing: -0.025em; margin: 22px 4px 10px; }
.hero-sub { color: var(--ink-2); font-size: var(--fs-callout); line-height: 1.45; margin: 0 4px; }
.reveal { margin-top: 22px; background: var(--surface); border-radius: 24px; padding: 14px; display: grid; gap: 12px; }
.docs3 { display: grid; gap: 8px; }
.mini-doc { display: grid; grid-template-columns: 30px 1fr; gap: 10px; align-items: start; padding: 10px; border-radius: 14px; background: var(--surface-2); font-size: var(--fs-footnote); line-height: 1.45; transition: box-shadow var(--dur-2), background var(--dur-2); }
.mini-doc .md-ic { width: 30px; height: 36px; border-radius: 6px; background: var(--surface); box-shadow: inset 0 0 0 0.5px var(--hairline-strong); display: grid; place-items: center; color: var(--ink-3); }
.mini-doc b { display: block; font-size: var(--fs-caption); font-weight: 600; color: var(--ink-3); margin-bottom: 1px; }
.mini-doc.lit { box-shadow: inset 0 0 0 1.5px var(--mark-line); }
.reveal-foot { display: grid; grid-template-columns: 112px 1fr; gap: 14px; align-items: center; }
.reveal-count { font-size: 44px; font-weight: 750; letter-spacing: -0.03em; font-variant-numeric: tabular-nums; line-height: 1; }
.reveal-count small { font-size: 15px; font-weight: 600; color: var(--ink-3); letter-spacing: 0; }
.reveal-caption { font-size: var(--fs-footnote); color: var(--ink-2); margin-top: 4px; }
.trust { display: grid; gap: 10px; margin: 22px 4px 0; }
.trust div { display: grid; grid-template-columns: 28px 1fr; gap: 10px; align-items: start; font-size: var(--fs-subhead); color: var(--ink-2); }
.trust .ic { color: var(--accent-text); margin-top: 1px; }

/* ===== status / overview ===== */
.status-card { background: var(--surface); border-radius: 22px; padding: 16px; display: grid; gap: 12px; }
.status-card .sc-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
.status-card .sc-doc { font-weight: 600; font-size: var(--fs-headline); }
.counts { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.count { border-radius: 14px; padding: 10px; background: var(--surface-2); display: grid; gap: 4px; }
.count strong { font-size: 26px; font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1; }
.count span { font-size: var(--fs-caption); color: var(--ink-2); display: flex; align-items: center; gap: 4px; line-height: 1.2; }
.count.high strong { color: var(--risk-high-fg); }
.count.mod strong { color: var(--risk-mod-fg); }
.coverage { display: grid; gap: 6px; font-size: var(--fs-footnote); color: var(--ink-2); }
.bar { height: 6px; border-radius: 3px; background: var(--surface-sunk); overflow: hidden; display: flex; }
.bar i { display: block; height: 100%; background: var(--src-device-fg); }
.bar i.rules { background: var(--ink-3); }
.bar i.un { background: repeating-linear-gradient(45deg, var(--unassessed-fg) 0 3px, transparent 3px 6px); opacity: 0.6; }
.cov-row { display: grid; grid-template-columns: 82px 1fr auto; gap: 10px; align-items: center; }

/* doc rows */
.docrow .doc-thumb { width: 34px; height: 42px; border-radius: 7px; background: var(--surface-2); box-shadow: inset 0 0 0 0.5px var(--hairline-strong); display: grid; place-items: center; color: var(--ink-3); flex: none; }
.docrow .doc-thumb.draft { color: var(--accent-text); background: var(--accent-soft); box-shadow: none; }

/* ===== document reading surface ===== */
.reader { background: var(--surface); border-radius: 20px; padding: 18px 18px 8px; font-size: var(--fs-body); line-height: 1.6; }
.reader .para { display: grid; grid-template-columns: 22px 1fr; gap: 6px; padding-bottom: 14px; }
.reader .para-anchor { padding-top: 5px; }
.reader .para.flash { animation: paraflash 1.2s var(--ease-out); border-radius: 8px; }
@keyframes paraflash { 0%, 50% { background: var(--accent-soft); } 100% { background: transparent; } }
.doc-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin: 0 4px 12px; font-size: var(--fs-footnote); color: var(--ink-3); }

/* ===== finding rows with swipe actions ===== */
.frow-wrap { position: relative; overflow: hidden; background: var(--surface); }

.frow { position: relative; z-index: 2; display: grid; grid-template-columns: 32px 1fr auto; gap: 12px; padding: 14px 16px; background: var(--surface); width: 100%; text-align: left; touch-action: pan-y; transition: transform var(--dur-2) var(--spring); }

.frow .f-where { display: block; font-size: var(--fs-caption); color: var(--ink-3); margin-top: 4px; }

/* ===== sheets ===== */
.sheet-layer { position: absolute; inset: 0; z-index: 80; pointer-events: none; }

.sheet { position: absolute; left: 8px; right: 8px; bottom: 8px; border-radius: 34px; pointer-events: auto; display: flex; flex-direction: column; transform: translateY(105%); transition: transform var(--dur-3) var(--spring); max-height: calc(100% - 60px); }
.sheet.in { transform: none; }
.sheet.dragging { transition: none; }
.sheet.medium { height: 58%; }
.sheet.large { height: calc(100% - 60px); }
.sheet .grabber { width: 38px; height: 5px; border-radius: 3px; background: var(--ink-3); opacity: 0.45; margin: 8px auto 2px; flex: none; position: relative; z-index: 2; }
.sheet-head { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; padding: 4px 12px 8px; position: relative; z-index: 2; touch-action: none; }
.sheet-head h3 { font-size: var(--fs-headline); font-weight: 600; text-align: center; }

.kv { display: grid; grid-template-columns: auto 1fr; gap: 8px 14px; font-size: var(--fs-footnote); }

.kv dd { margin: 0; text-align: right; color: var(--ink); font-weight: 500; min-width: 0; overflow-wrap: anywhere; }
.ev-card { display: grid; gap: 6px; padding: 12px; border-radius: 14px; background: var(--surface); text-align: left; width: 100%; box-shadow: inset 0 0 0 0.5px var(--hairline); }

.ev-card .ev-q { font-size: var(--fs-subhead); line-height: 1.5; }
.ev-list { display: grid; gap: 8px; }
.h-label { font-size: var(--fs-footnote); font-weight: 600; color: var(--ink-3); margin: 16px 2px 8px; text-transform: uppercase; letter-spacing: 0.04em; }
.diffbox { font-size: var(--fs-subhead); line-height: 1.55; background: var(--surface); border-radius: 14px; padding: 12px; box-shadow: inset 0 0 0 0.5px var(--hairline); }
.btn-row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 12px; }
.btn-row .btn { min-height: 48px; }
.btn-row .full { grid-column: 1 / -1; }
.note-field { width: 100%; min-height: 72px; border-radius: 12px; border: 0; background: var(--surface); box-shadow: inset 0 0 0 0.5px var(--hairline-strong); padding: 10px 12px; font-size: var(--fs-subhead); resize: vertical; }

/* ===== map ===== */
.graph-card { background: var(--surface); border-radius: 22px; padding: 10px 6px; overflow: hidden; }
.graph-card svg { display: block; width: 100%; height: auto; }
.g-node rect { fill: var(--surface-2); stroke: var(--hairline-strong); stroke-width: 1; }
.g-node.release rect { fill: var(--surface-2); }
.g-node.draft rect { fill: var(--accent-soft); stroke: none; }
.g-node.cat rect { fill: var(--surface); stroke: var(--hairline-strong); }
.g-node.finding rect { fill: var(--risk-high-bg); stroke: var(--risk-high-fg); stroke-width: 1.2; }
.g-node.finding.resolved rect { fill: var(--ok-bg); stroke: var(--ok-fg); }
.g-node text { fill: var(--ink); font-family: var(--font-ui); font-size: 11px; font-weight: 600; }
.g-node .sub { fill: var(--ink-3); font-weight: 500; font-size: 9.5px; }
.g-node.draft text { fill: var(--accent-text); }
.g-node.finding text { fill: var(--risk-high-fg); }
.g-node.finding.resolved text { fill: var(--ok-fg); }
.g-edge { fill: none; stroke: var(--ink-3); stroke-width: 1.4; opacity: 0.55; cursor: pointer; }
.g-edge.hot { stroke: var(--risk-high-fg); opacity: 0.9; stroke-width: 2; }

.g-legend { display: flex; flex-wrap: wrap; gap: 6px 12px; font-size: var(--fs-caption); color: var(--ink-3); margin: 8px 6px 2px; }

.steps { display: grid; gap: 2px; }
.step { display: grid; grid-template-columns: 1fr auto; gap: 8px; align-items: center; padding: 9px 10px; border-radius: 12px; text-align: left; width: 100%; }
.step[aria-pressed="true"] { background: var(--surface-2); }
.step .st-l { font-size: var(--fs-subhead); font-weight: 600; }
.step .st-s { font-size: var(--fs-caption); color: var(--ink-3); }
.step .st-n { font-size: var(--fs-title-3); font-weight: 700; font-variant-numeric: tabular-nums; }
.group-card { display: grid; grid-template-columns: 128px 1fr; gap: 14px; align-items: start; }

/* ===== journal ===== */
.jrow .j-time { font-family: var(--font-mono); font-size: var(--fs-micro); color: var(--ink-3); }
.sumchips { display: flex; gap: 8px; flex-wrap: wrap; margin: 0 4px 12px; }

/* ===== rewrite ===== */
.edit-card { background: var(--surface); border-radius: 20px; padding: 14px; display: grid; gap: 10px; }
.edit-card.applied { box-shadow: inset 0 0 0 1.5px var(--ok-fg); }

.keeps { display: flex; gap: 8px; align-items: flex-start; font-size: var(--fs-footnote); color: var(--ink-2); padding: 10px; border-radius: 12px; background: var(--surface-2); }

.reassess div { background: var(--surface-2); border-radius: 12px; padding: 10px 6px; text-align: center; }

.reassess span { font-size: var(--fs-micro); color: var(--ink-2); font-weight: 600; }

/* ===== release ===== */

/* ===== setup ===== */

/* ---------- seeded fictional population (8.3) ---------- */
// 100 toy records. IDs are not names. Counts are computed from these sets.
const POPULATION = (() => {
  let seed = 20261119;
  const rnd = () => { seed |= 0; seed = (seed + 0x6d2b79f5) | 0; let t = Math.imul(seed ^ (seed >>> 15), 1 | seed); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
  const ids = Array.from({ length: 100 }, (_, i) => i);
  for (let i = ids.length - 1; i > 0; i--) { const j = Math.floor(rnd() * (i + 1)); [ids[i], ids[j]] = [ids[j], ids[i]]; }
  const A = ids.slice(0, 24); // overnight pharmacy team
  const outside = ids.slice(24);
  const AB = A.slice(0, 8);
  const B = [...AB, ...outside.slice(0, 7)]; // winter onboarding cohort
  const C = [AB[0], outside[10], outside[20]]; // transfer from coastal satellite clinic
  const Cg = [...AB.slice(0, 7), ...A.slice(8, 22), ...outside.slice(30, 69)]; // moved from another site in the network
  const records = Array.from({ length: 100 }, (_, i) => ({ id: 'T-' + String(i + 1).padStart(3, '0'), i }));
  return { records, A: new Set(A), B: new Set(B), C: new Set(C), Cg: new Set(Cg) };
})();

function groupSteps(applied) {
  const P = POPULATION;
  const steps = [{ label: 'Fictional population', from: 'Seeded toy records', set: new Set(P.records.map((r) => r.i)) }];
  const narrow = (label, from, s) => { const prev = steps[steps.length - 1].set; steps.push({ label, from, set: new Set([...prev].filter((i) => s.has(i))) }); };
  narrow('Overnight pharmacy team', 'Interim report ¶2', P.A);
  if (!applied.has('F-03')) narrow('Winter onboarding cohort', 'Case study ¶2, linked by the date in P-07 ¶5', P.B);
  if (applied.has('F-01')) narrow('Moved from another site', 'P-07 ¶2 (revised)', P.Cg);
  else narrow('Transfer from the coastal satellite clinic', 'P-07 ¶2', P.C);
  return steps.map((s) => ({ ...s, count: s.set.size }));
}

const scoreOf = (f) => f.comps.direct + f.comps.specificity + f.comps.cross + f.comps.sensitivity;

  const s = scoreOf(f);
  let b = s >= 9 ? 'CRITICAL' : s >= 6 ? 'HIGH' : s >= 3 ? 'MODERATE' : 'LOW';
  if (f.override === 'HIGH' && (b === 'LOW' || b === 'MODERATE')) b = 'HIGH';
  return b;
}

function findings() {
  const sc = S.scenario;
  let list = FINDINGS.map((f) => ({ ...f }));
  if (sc === 'unsupported') list = list.map((f) => (f.source === 'DEVICE' ? { ...f, source: 'FIXTURE' } : f));
  if (sc === 'partial' || sc === 'error') {
    list = list.filter((f) => f.chunk !== 2);
    list.push({
      id: 'F-07', category: null, title: sc === 'error' ? '¶6–8 not assessed: the model reply was malformed' : '¶6–8 not assessed: the local model timed out',
      comps: { direct: 0, specificity: 0, cross: 0, sensitivity: 0 }, confidence: null, source: sc === 'error' ? 'DEVICE' : 'UNAVAILABLE', status: 'UNASSESSED',
      anchors: [{ doc: 'D3', para: 5, quote: '' }],
      rationale: sc === 'error'
        ? 'The reply did not match the findings schema. It was retried once on this device and then set aside. No cloud retry was made.'
        : 'This chunk did not finish within the time limit. It stays not assessed until you run it again. No cloud retry was made.',
      action: 'Run this chunk again', unassessed: true,
    });
  }
  for (const f of list) {
    if (S.statusOverride[f.id]) f.status = S.statusOverride[f.id];
    if (S.applied.has(f.id)) f.status = S.rescanned ? 'RESOLVED' : 'UNDER_REVIEW';
    f.band = f.unassessed ? null : bandOf(f);
    f.score = scoreOf(f);
  }
  return list;
}

const openFindings = () => findings().filter((f) => !['RESOLVED', 'DISMISSED', 'ACCEPTED_RESIDUAL'].includes(f.status));

}

function markPara(docId, idx, text, opts = {}) {

/* ---------- Liquid Glass refraction (progressive enhancement, 12.4) ---------- */
// Baseline glass is pure CSS. Where Chromium supports SVG filters in
// backdrop-filter, elements marked [data-refract] get an edge-refraction
// displacement map sized to their box.
const Refraction = {
  cache: new Map(),
  svg: null,
  get supported() {
    return typeof window !== 'undefined' && !!window.chrome && !/Firefox|FxiOS/.test(navigator.userAgent) && CSS.supports('backdrop-filter', 'blur(1px)');
  },
  get on() { return S.refraction && !S.reduced && this.supported && !window.matchMedia('(prefers-reduced-transparency: reduce)').matches; },
  ensureSvg() {
    if (this.svg) return this.svg;
    this.svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
    this.svg.setAttribute('width', '0'); this.svg.setAttribute('height', '0');
    this.svg.setAttribute('aria-hidden', 'true');
    this.svg.style.position = 'absolute';
    document.body.appendChild(this.svg);
    return this.svg;
  },
  map(w, h, r, edge) {
    const c = document.createElement('canvas'); c.width = w; c.height = h;
    const ctx = c.getContext('2d'); const img = ctx.createImageData(w, h); const d = img.data;
    const hw = w / 2, hh = h / 2;
    for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
      const px = x + 0.5 - hw, py = y + 0.5 - hh;
      const qx = Math.abs(px) - (hw - r), qy = Math.abs(py) - (hh - r);
      let dist, nx, ny;
      if (qx > 0 && qy > 0) { const L = Math.hypot(qx, qy); dist = L - r; nx = (qx / L) * Math.sign(px); ny = (qy / L) * Math.sign(py); }
      else if (qx > qy) { dist = qx - r; nx = Math.sign(px); ny = 0; }
      else { dist = qy - r; nx = 0; ny = Math.sign(py); }
      const depth = -dist; let m = 0;
      if (depth >= 0 && depth < edge) { const t = 1 - depth / edge; m = t * t * (3 - 2 * t); }
      const i = (y * w + x) * 4;
      d[i] = 128 - nx * m * 127; d[i + 1] = 128 - ny * m * 127; d[i + 2] = 128; d[i + 3] = 255;
    }
    ctx.putImageData(img, 0, 0);
    return c.toDataURL();
  },
  filterFor(w, h, r) {
    const key = `${w}x${h}r${r}`;
    if (this.cache.has(key)) return this.cache.get(key);
    const id = 'lg-' + this.cache.size;
    const edge = Math.min(22, h / 2.2);
    const href = this.map(w, h, r, edge);
    const svg = this.ensureSvg();
    const f = document.createElementNS('http://www.w3.org/2000/svg', 'filter');
    f.setAttribute('id', id);
    f.setAttribute('filterUnits', 'userSpaceOnUse');
    f.setAttribute('x', '0'); f.setAttribute('y', '0'); f.setAttribute('width', w); f.setAttribute('height', h);
    f.setAttribute('color-interpolation-filters', 'sRGB');
    f.innerHTML = `<feGaussianBlur in="SourceGraphic" stdDeviation="5" edgeMode="duplicate" result="b"/>
      <feImage href="${href}" x="0" y="0" width="${w}" height="${h}" preserveAspectRatio="none" result="m"/>
      <feDisplacementMap in="b" in2="m" scale="34" xChannelSelector="R" yChannelSelector="G" result="d"/>
      <feColorMatrix in="d" type="saturate" values="1.7"/>`;
    svg.appendChild(f);
    this.cache.set(key, id);
    return id;
  },
  apply(el) {
    const w = Math.round(el.offsetWidth), h = Math.round(el.offsetHeight);
    if (!w || !h) return;
    const r = Math.min(parseFloat(getComputedStyle(el).borderTopLeftRadius) || 0, h / 2, w / 2);
    const id = this.filterFor(w, h, Math.round(r));
    el.style.backdropFilter = `url(#${id})`;
    el.style.webkitBackdropFilter = `url(#${id})`;
    el.classList.add('refracting');
  },
  clear(el) { el.style.backdropFilter = ''; el.style.webkitBackdropFilter = ''; el.classList.remove('refracting'); },
  scan(root = document) { $$('[data-refract]', root).forEach((el) => (this.on ? this.apply(el) : this.clear(el))); },
  refresh() { requestAnimationFrame(() => this.scan()); },
};
window.addEventListener('resize', () => Refraction.refresh());

    ${icon ? `<span class="r-ic ${iconCls}">${ic(icon, 17)}</span>` : ''}
    <span class="r-main"><span class="r-title">${title}</span>${sub ? `<span class="r-sub">${sub}</span>` : ''}</span>
    <span class="r-end">${end}${chevron ? ic('chevron-right', 17) : ''}</span>
  </button>`;
const go = (name, params) => `data-go="${name}"${params ? ` data-p='${JSON.stringify(params)}'` : ''}`;
const scenarioBanner = (where) => {
  const sc = S.scenario;
  if (sc === 'unsupported') return `<div class="banner banner-warn">${ic('monitor-x', 18)}<div class="banner-body"><strong>No on-device model here</strong>You're viewing recorded sample results. Private workspaces run rules-only checks, and nothing moves to the cloud instead.</div></div>`;
  if (sc === 'offline' && where !== 'quiet') return `<div class="banner banner-neutral">${ic('wifi-off', 18)}<div class="banner-body"><strong>Offline</strong>Private review keeps working on this device. Cloud test packs resume when you reconnect.</div></div>`;
  if ((sc === 'partial' || sc === 'error') && where === 'review') return `<div class="banner banner-un">${ic('circle-dashed', 18)}<div class="banner-body"><strong>Partial scan</strong>${sc === 'error' ? 'The model reply for ¶6–8 was malformed.' : '¶6–8 timed out on this device.'} Those paragraphs are not assessed.<br><button type="button" class="btn btn-sm btn-tinted" data-act="run-chunk">${ic('rotate-cw', 14)} Run ¶6–8 again</button></div></div>`;
  return '';
};
const counts = () => {
  const o = openFindings();
  return {
    high: o.filter((f) => f.band === 'HIGH' || f.band === 'CRITICAL').length,
    mod: o.filter((f) => f.band === 'MODERATE').length,
    low: o.filter((f) => f.band === 'LOW').length,
    un: o.filter((f) => f.unassessed).length,
  };
};
const coverage = () => {
  const sc = S.scenario;
  const ctx = sc === 'unsupported' ? 0 : sc === 'partial' || sc === 'error' ? 5 : 8;
  return { ctx, rules: 8, total: 8 };
};
function docLabel(id, para) { return `${DOCS[id].short} ¶${para + 1}`; }

SCREENS.findings = () => {
  const all = findings();
  const f = M.filter;
  const pass = (x) => f === 'all' || (f === 'high' && (x.band === 'HIGH' || x.band === 'CRITICAL')) || (f === 'mod' && x.band === 'MODERATE') || (f === 'low' && x.band === 'LOW') || (f === 'un' && x.unassessed) || (f === 'device' && x.source === 'DEVICE') || (f === 'rules' && x.source === 'RULES');
  const list = all.filter(pass);
  const open = list.filter((x) => !['RESOLVED', 'DISMISSED', 'ACCEPTED_RESIDUAL'].includes(x.status));
  const closed = list.filter((x) => ['RESOLVED', 'DISMISSED', 'ACCEPTED_RESIDUAL'].includes(x.status));
  const n = (fn) => all.filter(fn).length;
  const chips = [
    ['all', 'All', all.length], ['high', 'High priority', n((x) => x.band === 'HIGH' || x.band === 'CRITICAL')], ['mod', 'Needs review', n((x) => x.band === 'MODERATE')],
    ['low', 'Low', n((x) => x.band === 'LOW')], ['un', 'Not assessed', n((x) => x.unassessed)], ['device', 'On device', n((x) => x.source === 'DEVICE')], ['rules', 'Rules', n((x) => x.source === 'RULES')],
  ].filter((c) => c[2] || c[0] === 'all');
  const frow = (x) => {
    const cat = x.category ? CATEGORY[x.category] : { icon: 'circle-dashed' };
    const docs = [...new Set(x.anchors.map((a) => DOCS[a.doc].short))];
    const done = ['RESOLVED', 'DISMISSED', 'ACCEPTED_RESIDUAL'].includes(x.status);
    return `<div class="frow-wrap" data-swipe>
      <div class="frow-actions">${done ? `<button type="button" class="a-dismiss" data-act="reopen" data-id="${x.id}">${ic('undo-2', 18)}Reopen</button>` : `<button type="button" class="a-dismiss" data-sheet="finding" data-id="${x.id}" data-v="dismiss">${ic('circle-slash', 18)}Dismiss</button>${x.rewrite ? `<button type="button" class="a-rewrite" ${go('rewrite', { focus: x.id })}>${ic('pen-line', 18)}Rewrite</button>` : ''}`}</div>
      <button type="button" class="frow ${done ? 'done' : ''}" data-sheet="finding" data-id="${x.id}">
        <span class="f-ic">${ic(cat.icon, 17)}</span>
        <span><span class="f-title">${esc(x.title)}</span>
          <span class="f-where">${x.id} · ${docs.join(' + ')}</span>
          <span class="f-meta">${riskChip(x.band, { small: true })}${sourceBadge(x.source)}${x.status !== 'OPEN' ? statusChip(x.status) : ''}</span></span>
        <span class="chev">${ic('chevron-right', 17)}</span>
      </button></div>`;
  };
  return {
    title: 'Findings', large: true,
    right: gRound('arrow-down-up', 'toast', 'Sort', 'data-msg="Sort by priority, document or status"'),
    body: `
      <p class="large-sub">P-07 transcript · draft ${draftVersion()}</p>
      ${scenarioBanner('review') ? `<div style="margin-bottom:12px">${scenarioBanner('review')}</div>` : ''}
      <div class="filters" role="toolbar" aria-label="Filter findings">${chips.map(([k, l, c]) => `<button type="button" class="fchip" aria-pressed="${k === f}" data-act="filter" data-v="${k}">${l} <span class="n">${c}</span></button>`).join('')}</div>
      ${open.length ? `<div class="group">${open.map(frow).join('')}</div>` : `<div class="empty"><h3>Nothing open in this filter</h3><p>That doesn’t mean the draft is anonymous. It means no open finding matches.</p></div>`}
      ${closed.length ? `<div class="eyebrow">Closed</div><div class="group">${closed.map(frow).join('')}</div>` : ''}
      <p class="foot">Swipe left to dismiss or rewrite. Findings are suggestions; you decide what to publish.</p>`,
  };
};

function graphSvg() {
  const fs = findings();
  const has = (id) => fs.some((f) => f.id === id);
  const fstate = (id) => fs.find((f) => f.id === id);
  const visible = (e) => [e.a, e.b].every((n) => !n.startsWith('F-') || has(n)) && !(e.b === 'c4' && !has('F-05')) && !(e.a === 'c4' && !has('F-05'));
  const cut = (e) => (e.id === 'e5' && S.applied.has('F-01')) || (e.id === 'e4' && S.applied.has('F-03')) || (e.id === 'e2' && S.applied.has('F-02')) || (e.id === 'e6' && S.applied.has('F-05'));
  const N = G.nodes;
  const path = (e) => { const a = N[e.a], b = N[e.b]; const x1 = a.x + a.w / 2, y1 = a.y + a.h, x2 = b.x + b.w / 2, y2 = b.y; const my = (y1 + y2) / 2; return `M${x1} ${y1} C${x1} ${my}, ${x2} ${my}, ${x2} ${y2}`; };
  const edges = G.edges.filter(visible).map((e) => `<g><path class="g-hit" d="${path(e)}" data-sheet="edge" data-id="${e.id}" tabindex="0" role="button" aria-label="${esc(N[e.a].t)} to ${esc(N[e.b].t)}"></path><path class="g-edge${e.hot && !S.applied.has('F-01') ? ' hot' : ''}${cut(e) ? ' cut' : ''}" d="${path(e)}"></path></g>`).join('');
  const nodes = Object.entries(N).filter(([k]) => !k.startsWith('F-') || has(k)).filter(([k]) => k !== 'c4' || has('F-05')).map(([k, n]) => {
    const f = k.startsWith('F-') ? fstate(k) : null;
    const resolved = f && ['RESOLVED', 'DISMISSED', 'ACCEPTED_RESIDUAL'].includes(f.status);
    const sub = f ? (resolved ? STATUS[f.status].label : BAND[f.band].label) : n.s;
    const sel = f ? `data-sheet="finding" data-id="${k}"` : k.length === 2 ? `${go('document', { doc: k })}` : '';
    return `<g class="g-node ${n.cls}${resolved ? ' resolved' : ''}" ${sel} tabindex="0" role="button" style="cursor:pointer"><rect x="${n.x}" y="${n.y}" width="${n.w}" height="${n.h}" rx="10"></rect><text x="${n.x + 9}" y="${n.y + (sub ? 18 : n.h / 2 + 4)}">${esc(n.t)}</text>${sub ? `<text class="sub" x="${n.x + 9}" y="${n.y + 32}">${esc(sub)}</text>` : ''}</g>`;
  }).join('');
  return `<svg viewBox="0 0 340 312" role="group" aria-label="Disclosure map">${edges}${nodes}</svg>`;
}

SCREENS.rewrite = (p = {}) => {
  const cands = findings().filter((f) => f.rewrite && f.status !== 'DISMISSED');
  const pending = cands.filter((f) => !S.applied.has(f.id));
  const applied = cands.filter((f) => S.applied.has(f.id));
  const order = p.focus ? [...cands].sort((a, b) => (a.id === p.focus ? -1 : b.id === p.focus ? 1 : 0)) : cands;
  const paras = DOCS.D3.paras;
  const card = (f) => {
    const on = S.applied.has(f.id);
    const r = f.rewrite;
    const before = paras[r.para];
    const i = before.indexOf(r.from);
    const ctxL = before.slice(Math.max(0, i - 38), i);
    const ctxR = before.slice(i + r.from.length, i + r.from.length + 38);
    return `<div class="edit-card ${on ? 'applied' : ''}" id="ec-${f.id}">
      <div class="ec-top"><span class="hstack">${riskChip(f.band, { small: true })}<span class="small muted">${f.id} · ¶${r.para + 1}</span></span>${on ? `<span class="chip chip-ok chip-sm">${ic('check', 13)}<span>Applied</span></span>` : sourceBadge(S.scenario === 'unsupported' ? 'FIXTURE' : f.source === 'RULES' ? 'RULES' : 'DEVICE')}</div>
      <strong>${f.action}</strong>
      <div class="diffbox">${i > 38 ? '…' : ''}${esc(ctxL)}<del class="diff">${esc(r.from)}</del>${r.to ? ` <ins class="diff">${esc(r.to)}</ins>` : ''}${esc(ctxR)}…</div>
      <div class="keeps">${ic('circle-check', 16)}<span><b>Still true:</b> ${esc(f.keeps)}</span></div>
      ${on ? `<div class="btn-row"><button type="button" class="btn btn-quiet full" data-act="undo" data-id="${f.id}">${ic('undo-2', 16)} Undo</button></div>` : `<div class="btn-row"><button type="button" class="btn btn-quiet" data-act="toast" data-msg="Opens a manual editor for ¶${r.para + 1}">${ic('pencil', 16)} Edit myself</button><button type="button" class="btn btn-primary" data-act="apply" data-id="${f.id}">Apply</button></div>`}
    </div>`;
  };
  const before = groupSteps(new Set());
  const after = groupSteps(S.applied);
  return {
    title: 'Rewrite', sub: `P-07 · draft v3 → ${S.applied.size ? 'v4' : 'v4 (unsaved)'}`, large: false, back: true, tabbar: false,
    toolbar: `<span class="tb-mid" style="text-align:left;padding-left:10px">${applied.length ? `${applied.length} edit${applied.length > 1 ? 's' : ''} applied` : 'No edits yet'}</span><button type="button" class="gbtn primary" data-act="rescan" ${applied.length ? '' : 'disabled style="opacity:.45"'}>${ic('scan-search', 16)} Review again</button>`,
    body: `
      <p class="small muted" style="margin:0 4px 12px">Suggestions are written on this device. The original stays unchanged; applying creates a new version you can undo.</p>
      ${S.rescanned && applied.length ? `<div class="card" style="margin-bottom:12px"><div class="hstack" style="justify-content:space-between;margin-bottom:10px"><strong>Reassessment</strong>${sourceBadge(S.scenario === 'unsupported' ? 'FIXTURE' : 'DEVICE')}</div>
        <div class="reassess"><div><strong>${applied.length}</strong><span>Resolved</span></div><div><strong>${openFindings().length}</strong><span>Unchanged</span></div><div><strong>0</strong><span>New</span></div><div><strong>${counts().un}</strong><span>Not assessed</span></div></div>
        <p class="small" style="margin-top:12px;color:var(--ink-2)">Fictional group: <b class="tnum">${before[before.length - 1].count}</b> → <b class="tnum">${after[after.length - 1].count}</b> of 100 records.</p>
        <div class="btn-row"><button type="button" class="btn btn-tinted full" ${go('release')}>Continue to release review</button></div></div>` : ''}

  };

  const residual = openFindings().filter((f) => !f.unassessed);
  const items = ['I’ve read every remaining finding.', 'The remaining details are needed for the analysis.', 'I understand this review is advisory and doesn’t certify anonymity.'];

/* ---------- rendering ---------- */
function buildScreen(route) {
  const def = SCREENS[route.name](route.params || {});
  const el = document.createElement('section');
  el.className = `screen ${def.cls || ''} ${def.large === false ? 'no-large' : ''} ${def.tabbar === false ? 'no-tabbar' : ''}`;
  el.dataset.route = route.name;
  const hasBack = def.back || currentStack().length > 1;
  el.innerHTML = `
    ${def.hideTop ? '' : `<header class="topbar"><div class="edge"></div><div class="t-left">${hasBack ? backBtn() : ''}${def.left || ''}</div><div class="t-title">${esc(def.title || '')}${def.sub ? `<span class="t-sub">${esc(def.sub)}</span>` : ''}</div><div class="t-right">${def.right || ''}</div></header>`}
    <div class="scroll">${def.large !== false && def.title ? `<h1 class="large-title">${esc(def.title)}</h1>` : ''}${def.body}</div>
    ${def.toolbar ? `<div class="toolbar glass" data-refract>${def.toolbar}</div>` : ''}`;
  el._def = def;
  const sc = $('.scroll', el);
  sc.addEventListener('scroll', () => el.classList.toggle('collapsed', sc.scrollTop > 30), { passive: true });
  return el;
}

function renderTabbar() {
  const top = topRoute();
  const def = stackEl.lastElementChild?._def;
  const hidden = M.mode === 'onboarding' || (def && def.tabbar === false);
  tabbarEl.classList.toggle('hidden', !!hidden);
  const n = openFindings().filter((f) => f.band === 'HIGH' || f.band === 'CRITICAL').length;
  tabbarEl.innerHTML = TABS.map(([k, l, icon]) => `<button type="button" class="tab" data-tab="${k}" ${M.tab === k ? 'aria-current="page"' : ''}>${ic(icon, 22)}<span>${l}</span>${k === 'findings' && n ? `<span class="badge">${n}</span>` : ''}</button>`).join('');
  void top;
}

function mountScreen(el) {
  if (el._def.mount) el._def.mount(el);
  Refraction.scan(el);
}

function showTop(anim = 'none') {
  const route = topRoute();
  const el = buildScreen(route);
  const old = stackEl.lastElementChild;
  stackEl.appendChild(el);
  renderTabbar();
  mountScreen(el);
  Refraction.scan(tabbarEl);
  if (!old || anim === 'none' || reduceMotion()) {
    if (old) old.remove();
    if (old && anim !== 'none') el.animate([{ opacity: 0 }, { opacity: 1 }], { duration: 160 });
    finishNav();
    return;
  }
  const spring = 'cubic-bezier(0.2, 0.9, 0.25, 1)';
  if (anim === 'push') {
    el.animate([{ transform: 'translateX(100%)' }, { transform: 'translateX(0)' }], { duration: 440, easing: spring });
    old.animate([{ transform: 'translateX(0)', filter: 'brightness(1)' }, { transform: 'translateX(-28%)', filter: 'brightness(0.92)' }], { duration: 440, easing: spring }).onfinish = () => { old.remove(); finishNav(); };
  } else if (anim === 'pop') {
    stackEl.insertBefore(el, old);
    el.animate([{ transform: 'translateX(-28%)' }, { transform: 'translateX(0)' }], { duration: 400, easing: spring });
    old.animate([{ transform: 'translateX(0)' }, { transform: 'translateX(100%)' }], { duration: 400, easing: spring }).onfinish = () => { old.remove(); finishNav(); };
  } else {
    el.animate([{ opacity: 0 }, { opacity: 1 }], { duration: 180 });
    old.remove();
    finishNav();
  }
}
function finishNav() { renderNotes(); syncPreviewScreen(); }

function refreshTop() {
  const old = stackEl.lastElementChild;
  if (!old) return showTop();
  const sc = $('.scroll', old);
  const top = sc ? sc.scrollTop : 0;
  const el = buildScreen(topRoute());
  stackEl.replaceChild(el, old);
  const nsc = $('.scroll', el);
  if (nsc) { nsc.scrollTop = top; el.classList.toggle('collapsed', top > 30); }
  renderTabbar();
  Refraction.scan(el);
  Refraction.scan(tabbarEl);
}

function push(name, params) { currentStack().push({ name, params }); M.docFocus = 0; showTop('push'); }
function pop() { if (currentStack().length > 1) { currentStack().pop(); showTop('pop'); } else if (M.mode === 'tabs' && M.tab === 'workspaces') { M.mode = 'onboarding'; showTop('pop'); } }
function switchTab(tab) { M.mode = 'tabs'; if (M.tab === tab && currentStack().length > 1) { M.stacks[tab] = [M.stacks[tab][0]]; } M.tab = tab; showTop('fade'); }

/* ---------- sheets ---------- */
function openSheet(kind, params = {}) {
  closeSheets(true);
  const def = SHEETS[kind](params);
  const scrim = document.createElement('div'); scrim.className = 'scrim'; scrim.dataset.close = '';
  const el = document.createElement('div');
  el.className = `sheet glass glass-strong ${def.detent || 'medium'}`;
  el.setAttribute('role', 'dialog'); el.setAttribute('aria-modal', 'true'); el.setAttribute('aria-label', def.title);
  el._kind = kind; el._params = params;
  el.innerHTML = sheetInner(def);
  sheetsEl.append(scrim, el);
  M.sheets = [{ el, scrim }];
  requestAnimationFrame(() => { scrim.classList.add('in'); el.classList.add('in'); });
  Refraction.scan(el);
  bindSheetDrag(el);
  setTimeout(() => $('.sheet-body', el)?.focus?.(), 50);
}
function sheetInner(def) {
  return `<div class="grabber" aria-hidden="true"></div><div class="sheet-head"><div class="sh-l">${def.left || ''}</div><h3>${esc(def.title)}</h3><div class="sh-r">${def.right || ''}</div></div><div class="sheet-body" tabindex="-1">${def.body}</div>`;
}
function refreshSheet() {
  const s = M.sheets[0];
  if (!s) return;
  const sb = $('.sheet-body', s.el); const top = sb ? sb.scrollTop : 0;
  const def = SHEETS[s.el._kind](s.el._params);
  s.el.innerHTML = sheetInner(def);
  $('.sheet-body', s.el).scrollTop = top;
  Refraction.scan(s.el);
}
function closeSheets(instant) {
  for (const { el, scrim } of M.sheets) {
    if (instant) { el.remove(); scrim.remove(); continue; }
    el.classList.remove('in'); scrim.classList.remove('in');
    setTimeout(() => { el.remove(); scrim.remove(); }, 380);
  }
  M.sheets = [];
}
function bindSheetDrag(el) {
  let y0 = null, dy = 0;
  const start = (e) => { if (!e.target.closest('.grabber, .sheet-head') || e.target.closest('button')) return; y0 = e.clientY; dy = 0; el.classList.add('dragging'); el.setPointerCapture(e.pointerId); };
  const move = (e) => { if (y0 == null) return; dy = Math.max(0, e.clientY - y0); el.style.transform = `translateY(${dy}px)`; };
  const end = () => { if (y0 == null) return; el.classList.remove('dragging'); el.style.transform = ''; if (dy > 110) closeSheets(); y0 = null; };
  el.addEventListener('pointerdown', start); el.addEventListener('pointermove', move); el.addEventListener('pointerup', end); el.addEventListener('pointercancel', end);
}

/* ---------- swipe actions ---------- */
function bindSwipe() {
  let cur = null, x0 = 0, y0 = 0, dx = 0, locked = null, moved = false;
  const W = (wrap) => $('.frow-actions', wrap).offsetWidth;
  $('#device').addEventListener('pointerdown', (e) => {
    const row = e.target.closest('[data-swipe] .frow');
    $$('[data-swipe] .frow.open').forEach((r) => { if (r !== row) { r.classList.remove('open'); r.style.transform = ''; } });
    if (!row) return;
    cur = row; x0 = e.clientX; y0 = e.clientY; dx = 0; locked = null; moved = false;
  });
  $('#device').addEventListener('pointermove', (e) => {
    if (!cur) return;
    const ddx = e.clientX - x0, ddy = e.clientY - y0;
    if (locked == null && (Math.abs(ddx) > 6 || Math.abs(ddy) > 6)) locked = Math.abs(ddx) > Math.abs(ddy) ? 'x' : 'y';
    if (locked !== 'x') return;
    moved = true;
    const base = cur.classList.contains('open') ? -W(cur.parentElement) : 0;
    dx = Math.min(0, Math.max(-W(cur.parentElement) - 30, base + ddx));
    cur.classList.add('dragging');
    cur.style.transform = `translateX(${dx}px)`;
  });
  const end = () => {
    if (!cur) return;
    cur.classList.remove('dragging');
    if (moved) {
      const open = dx < -W(cur.parentElement) / 2;
      cur.classList.toggle('open', open);
      cur.style.transform = open ? `translateX(${-W(cur.parentElement)}px)` : '';
      cur._suppress = true; setTimeout(() => { if (cur) cur._suppress = false; }, 0);
      const c = cur; setTimeout(() => { c._suppress = false; }, 50);
    }
    cur = null;
  };
  $('#device').addEventListener('pointerup', end);
  $('#device').addEventListener('pointercancel', end);
}

/* ---------- actions ---------- */
function act(name, el) {
  const id = el.dataset.id, v = el.dataset.v;
  switch (name) {
    case 'start-sample': M.mode = 'tabs'; M.tab = 'workspaces'; M.stacks.workspaces = [{ name: 'workspaces' }, { name: 'overview' }]; showTop('push'); break;
    case 'create-ws': M.mode = 'tabs'; M.tab = 'workspaces'; M.stacks.workspaces = [{ name: 'workspaces' }, { name: 'overview', params: { blank: true } }]; showTop('push'); break;
    case 'replay': playLanding(); break;
    case 'model-state': setState({ modelPreview: v }); break;
    case 'storage': M.storageMode = v; refreshTop(); break;
    case 'open-import': openSheet('import'); break;
    case 'rescan': setState({ rescanned: true }); toast(S.applied.size ? 'Reviewed again on this device (preview)' : 'Review ran on this device (preview)', 'scan-search'); break;
    case 'run-chunk': setState({ scenario: 'normal' }); toast('¶6–8 ran again on this device (preview)', 'rotate-cw'); break;
    case 'apply': { const a = new Set(S.applied); a.add(id); setState({ applied: a, rescanned: false, approved: false }); toast(`Applied ${id} · draft v4 created`, 'pen-line'); break; }
    case 'undo': { const a = new Set(S.applied); a.delete(id); setState({ applied: a, rescanned: false, approved: false }); toast(`Undid ${id}`, 'undo-2'); break; }
    case 'dismiss': setState({ statusOverride: { ...S.statusOverride, [id]: 'DISMISSED' } }); closeSheets(); toast(`${id} dismissed`, 'circle-slash'); break;
    case 'residual': setState({ statusOverride: { ...S.statusOverride, [id]: 'ACCEPTED_RESIDUAL' } }); closeSheets(); toast(`${id} accepted as residual`, 'circle-check-big'); break;
    case 'reopen': { const o = { ...S.statusOverride }; delete o[id]; const a = new Set(S.applied); a.delete(id); setState({ statusOverride: o, applied: a }); closeSheets(); toast(`${id} reopened`, 'undo-2'); break; }
    case 'filter': M.filter = v; refreshTop(); break;
    case 'map-mode': M.mapMode = v; refreshTop(); break;
    case 'map-stage': M.mapStage = Number(v); refreshTop(); break;
    case 'map-reset': M.mapStage = 3; M.mapMode = 'map'; refreshTop(); break;
    case 'doc-next': case 'doc-prev': {
      const r = topRoute(); const docId = r.params?.doc || 'D3';
      const fl = findings().filter((f) => f.anchors.some((a) => a.doc === docId && a.quote));
      if (!fl.length) break;
      M.docFocus = (M.docFocus + (name === 'doc-next' ? 1 : fl.length - 1)) % fl.length;
      const f = fl[M.docFocus];
      const mk = $(`.screen:last-child mark[data-f="${f.id}"]`);
      $('.screen:last-child .tb-mid').textContent = `Finding ${M.docFocus + 1} of ${fl.length}`;
      if (mk) { mk.scrollIntoView({ block: 'center', behavior: reduceMotion() ? 'auto' : 'smooth' }); mk.classList.remove('flash'); void mk.offsetWidth; mk.classList.add('flash'); }
      break;
    }
    case 'check': { const c = [...S.checklist]; c[Number(v)] = !c[Number(v)]; setState({ checklist: c }); break; }
    case 'approve': setState({ approved: true }); toast('Approved on this device', 'stamp'); break;
    case 'revoke': setState({ approved: false, checklist: [false, false, false] }); toast('Approval revoked', 'undo-2'); break;
    case 'pack-expand': M.expandedPack = M.expandedPack === v ? null : v; refreshTop(); break;
    case 'pack-toggle': setState({ packsEnabled: { ...S.packsEnabled, [v]: el.checked } }); break;
    case 'gen-domain': M.genDomain = v; refreshTop(); break;
    case 'gen-cat': M.genCats.has(v) ? M.genCats.delete(v) : M.genCats.add(v); refreshTop(); break;
    case 'consent-send': setState({ consent: 'sent' }); closeSheets(); toast('Design preview: no request was sent', 'cloud'); break;
    case 'export-kind': M.exportKind = v; refreshTop(); break;
    case 'export-fmt': M.exportFmt = v; refreshTop(); break;
    case 'theme': setState({ appearance: v }); break;
    case 'pref-reduced': setState({ reduced: el.checked }); break;
    case 'pref-refraction': setState({ refraction: el.checked }); break;
    case 'session-only': M.sessionOnly = el.checked; break;
    case 'toast': toast(el.dataset.msg || 'Preview only', 'info'); break;
    case 'noop-req': toast('Lists the supported devices', 'info'); break;
    default: break;
  }
}

$('#device').addEventListener('click', (e) => {
  const t = e.target;
  const frow = t.closest('.frow');
  if (frow && frow._suppress) { e.preventDefault(); return; }
  if (frow && frow.classList.contains('open')) { frow.classList.remove('open'); frow.style.transform = ''; return; }
  const closeEl = t.closest('[data-close]');
  const goEl = t.closest('[data-go]');
  const tabgo = t.closest('[data-tabgo]');
  const tab = t.closest('[data-tab]');
  const back = t.closest('[data-back]');
  const sheetEl = t.closest('[data-sheet]');
  const sheetV = t.closest('[data-sheet-v]');
  const actEl = t.closest('[data-act]');
  const mark = t.closest('mark.ev[data-f]');
  if (actEl && actEl.tagName === 'INPUT') return; // handled on change
  if (closeEl) closeSheets();
  if (back) return pop();
  if (tab) return switchTab(tab.dataset.tab);
  if (tabgo) return switchTab(tabgo.dataset.tabgo);
  if (mark && !t.closest('.ev-card')) return openSheet('finding', { id: mark.dataset.f });
  if (sheetV) { const s = M.sheets[0]; if (s) { s.el._params = { id: sheetV.dataset.id, v: sheetV.dataset.v }; refreshSheet(); } return; }
  if (sheetEl) return openSheet(sheetEl.dataset.sheet, { id: sheetEl.dataset.id, v: sheetEl.dataset.v });
  if (actEl) act(actEl.dataset.act, actEl);
  if (goEl) {
    const name = goEl.dataset.go;
    const params = goEl.dataset.p ? JSON.parse(goEl.dataset.p) : undefined;
    if (name === 'findings') return switchTab('findings');
    if (M.mode === 'tabs' && !['workspaces'].includes(M.tab) && ['document', 'overview', 'release', 'history', 'export', 'tests', 'rewrite'].includes(name)) { push(name, params); return; }
    push(name, params);
  }
});
$('#device').addEventListener('change', (e) => { const a = e.target.closest('[data-act]'); if (a && a.tagName === 'INPUT') act(a.dataset.act, a); });
$('#device').addEventListener('keydown', (e) => {
  if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('mark.ev[data-f], g[role="button"], path[role="button"]')) { e.preventDefault(); e.target.dispatchEvent(new MouseEvent('click', { bubbles: true })); }
  if (e.key === 'Escape' && M.sheets.length) closeSheets();
});

/* ---------- landing animation ---------- */
let landingTimer = null;
function playLanding() {
  clearInterval(landingTimer);
  if (reduceMotion()) { M.landingStage = 3; if (topRoute().name === 'landing') refreshTop(); return; }
  M.landingStage = 0;
  if (topRoute().name === 'landing') refreshTop();
  landingTimer = setInterval(() => {
    if (topRoute().name !== 'landing') return clearInterval(landingTimer);
    M.landingStage++;
    // update in place so tiles animate
    const scr = stackEl.lastElementChild;
    const steps = groupSteps(new Set());
    const grid = $('.mosaic', scr);
    if (grid) grid.outerHTML = mosaicGrid(steps, M.landingStage);
    // re-query because outerHTML replaced it; animate by toggling classes next frame
    const cnt = $('.reveal-count', scr); if (cnt) cnt.innerHTML = `${steps[M.landingStage].count}<small> of 100</small>`;
    const cap = $('.reveal-caption', scr); if (cap) cap.textContent = ['A fictional population of 100 people.', 'The March report narrows it to one team.', 'The June case study narrows it again.', 'The new draft leaves one person.'][M.landingStage];
    $$('.mini-doc', scr).forEach((d, i) => d.classList.toggle('lit', i < M.landingStage));
    if (M.landingStage >= 3) clearInterval(landingTimer);
  }, 1300);
}

/* ---------- preview panel + notes ---------- */
const NOTES = {
  landing: ['Landing', '12.2 · 5.1 · F01', ['Three-document reveal: each release looks harmless; together they leave 1 of 100 fictional records.', 'Counts come from the seeded fictional population, not typed numbers.', 'Two prominent actions, no sign-up.']],
  setup: ['Setup', '7.4 · F01 · F25', ['All eight model states are previewable with the chips.', 'No fake progress: downloading shows an indeterminate bar until the system reports progress.', 'Storage choice: keep on device or session only.']],
  workspaces: ['Workspace list', '12.2 · F02', ['Sample workspace is separate and labelled fictional.', 'Swipe a private workspace left for Rename and Delete.', 'Try the Empty state in the panel.']],
  overview: ['Workspace overview', '12.2 · 5.4', ['Counts by priority with icon, text and colour.', 'Coverage bars separate contextual (on-device) from rules checks.', 'Try Partial scan and Unsupported device states.']],
  document: ['Document review', '12.3 · F05', ['Solid reading surface; glass only on bars.', 'Tap a highlight to open the finding sheet.', 'The bottom toolbar steps through findings.']],
  findings: ['Findings', '6.3 · F11', ['Filters by priority and actual source.', 'Swipe left for Dismiss and Rewrite.', 'Closed findings move to their own group.']],
  map: ['Disclosure map', '12.3 · F09', ['Nodes: releases, draft, generic categories, findings. None represents a person.', 'Tap a line for its reason and passages; List gives the accessible alternative.', 'Group-size steps recompute after rewrites.']],
  tests: ['Stress tests', '6.2 · F10 · F16', ['Source badges: bundled, generated in cloud, cached.', 'Generation is built from enums only. Review request shows the exact JSON.', 'Try the Offline state.']],
  rewrite: ['Rewrite studio', '6.4 · F12 · F13', ['Each edit shows the diff and what stays true.', 'Apply creates v4; Undo is per edit.', 'Review again shows resolved, unchanged, new and not assessed.']],
  release: ['Release review', '12.2 · F14', ['Before and after: high-priority count and fictional group size.', 'Approval needs the checklist and full coverage.', 'Copy never says "safe".']],
  history: ['Release history', 'F14', ['Approved snapshots used as the comparison baseline.', 'Approval can be revoked.']],
  export: ['Reports & export', 'F17', ['Clean draft and review report stay separate.', 'Lists exactly what is left out.']],
  journal: ['Inference journal', 'F15 · 9.4', ['Requested policy next to actual source from SDK metadata.', 'Tap the cloud entry to see the exact payload that was sent.']],
  settings: ['Settings', '12.2 · F22', ['Theme, reduce transparency and glass effects work live.', 'Delete flows explain the limits of deletion.']],
  benchmark: ['Benchmark lab', '14 · F19', ['Results table stays empty until the runner produces real numbers.', 'Population illustration is computed from fixtures.']],
};
function renderNotes() {
  const n = NOTES[topRoute().name];
  const host = $('#notes');
  if (!n) { host.innerHTML = ''; return; }
  host.innerHTML = `<h2>${n[0]}</h2><span class="spec">Spec ${n[1]}</span><ul>${n[2].map((x) => `<li>${esc(x)}</li>`).join('')}</ul><p class="spec">Use the panel on the left to jump between screens and states.</p>`;
}
function syncPreviewScreen() { const sel = $('#pv-screen'); if (sel) sel.value = topRoute().name; }
function renderPreview() { $('#pv').innerHTML = previewControls(topRoute().name); }

function jumpTo(screen) {
  closeSheets(true);
  const W = { name: 'workspaces' }, O = { name: 'overview' };
  const map = {
    landing: ['onboarding', [{ name: 'landing' }]],
    setup: ['onboarding', [{ name: 'landing' }, { name: 'setup' }]],
    workspaces: ['workspaces', [W]],
    overview: ['workspaces', [W, O]],
    import: ['workspaces', [W, O]],
    document: ['workspaces', [W, O, { name: 'document' }]],
    map: ['map', [{ name: 'map' }]],
    findings: ['findings', [{ name: 'findings' }]],
    tests: ['workspaces', [W, O, { name: 'tests' }]],
    rewrite: ['workspaces', [W, O, { name: 'rewrite' }]],
    release: ['workspaces', [W, O, { name: 'release' }]],
    history: ['workspaces', [W, O, { name: 'history' }]],
    export: ['workspaces', [W, O, { name: 'export' }]],
    journal: ['journal', [{ name: 'journal' }]],
    benchmark: ['settings', [{ name: 'settings' }, { name: 'benchmark' }]],
    settings: ['settings', [{ name: 'settings' }]],
  };
  const [tab, stack] = map[screen];
  if (tab === 'onboarding') { M.mode = 'onboarding'; M.stacks.onboarding = stack; }
  else { M.mode = 'tabs'; M.tab = tab; M.stacks[tab] = stack; }
  showTop('fade');
  if (screen === 'import') setTimeout(() => openSheet('import'), 200);
  if (screen === 'landing') playLanding();
}

/* ---------- boot ---------- */
function fit() {
  const sc = $('#scaler');
  if (window.innerWidth <= 720) { sc.style.transform = ''; sc.style.marginBottom = ''; return; }
  const s = Math.min(1, (window.innerHeight - 84) / 852);
  sc.style.transform = `scale(${s})`;
  sc.style.marginBottom = `${852 * s - 852}px`;
}
window.addEventListener('resize', fit);

function renderStatusIcons() { $('#sb-icons').innerHTML = `${ic('signal', 17)}${ic(isOffline() ? 'wifi-off' : 'wifi', 17)}${ic('battery-full', 22)}`; }

onState((patch) => {
  renderPreview();
  renderStatusIcons();
  if (Object.keys(patch).some((k) => !['appearance', 'accent', 'reduced', 'refraction'].includes(k))) { refreshTop(); refreshSheet(); }
  else { refreshTop(); }
});

bindPreviewControls($('#pv'), (screen) => jumpTo(screen));
$('#pv-fab').addEventListener('click', () => { const p = $('#pv'); const o = p.classList.toggle('open'); $('#pv-fab').setAttribute('aria-expanded', o); });

applyAppearance();
renderPreview();
renderStatusIcons();
fit();
showTop();
playLanding();
bindSwipe();
</script>
